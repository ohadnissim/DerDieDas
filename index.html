<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Der Die Das"><link rel="apple-touch-icon" href="img/stk-dollhouse.webp"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style></head><body><title>Der Die Das</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --ground:#FCF0F7; --ground-2:#F1E4FB; --surface:#FFFFFF; --ink:#3B2352; --muted:#86709C; --line:#EBDDF3;
  --paper:#F1EEE6;
  --grape:#9B4DDB; --grape-deep:#6C2BAA; --grape-soft:#EFE2FC;
  --pink:#FF78B5; --pink-deep:#D24E8E; --pink-soft:#FFE1F0;
  --der:#2F9BE0; --die:#E2553F; --das:#F6DB2A;
  --der-deep:#1B6CA8; --die-deep:#A8372A; --das-deep:#C2A300;
  --der-soft:#DDEFFB; --die-soft:#FCE2DD; --das-soft:#FFF6C4;
  --der-hi:#A9DBF8; --die-hi:#F8B2A6; --das-hi:#FFF4A6;
  --das-ink:#8A6D00; --on-das:#3B2352;
  --star:#FF9F1C; --star-deep:#C96F00;
  --on-color:#FFFFFF;
  --lift:0 14px 30px rgba(92,38,130,.14), 0 2px 0 rgba(92,38,130,.06);
  --blob-a:rgba(255,120,181,.30); --blob-b:rgba(155,77,219,.24); --blob-c:rgba(255,184,31,.18);
  --glass:rgba(255,255,255,.55); --slot-line:rgba(155,77,219,.38);
  --display:"Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1C1128; --ground-2:#27163A; --surface:#2F1E45; --ink:#F7EEFF; --muted:#B9A3CF; --line:#44305E;
    --grape:#B476F0; --grape-deep:#7B3BBF; --grape-soft:#33224D;
    --pink:#FF8CC2; --pink-deep:#C4477F; --pink-soft:#3E2140;
    --der:#4AAAE8; --die:#EC6A55; --das:#F6DB2A;
    --der-deep:#1F6FA8; --die-deep:#A33A2D; --das-deep:#B89A00;
    --der-soft:#1E2944; --die-soft:#3A2024; --das-soft:#3A3313;
    --das-ink:#F7D21E;
    --lift:0 14px 30px rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.2);
    --blob-a:rgba(255,120,181,.16); --blob-b:rgba(155,77,219,.20); --blob-c:rgba(255,184,31,.08);
    --glass:rgba(255,255,255,.06); --slot-line:rgba(200,160,240,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#1C1128; --ground-2:#27163A; --surface:#2F1E45; --ink:#F7EEFF; --muted:#B9A3CF; --line:#44305E;
  --grape:#B476F0; --grape-deep:#7B3BBF; --grape-soft:#33224D;
  --pink:#FF8CC2; --pink-deep:#C4477F; --pink-soft:#3E2140;
  --der:#4AAAE8; --die:#EC6A55; --das:#F6DB2A;
  --der-deep:#1F6FA8; --die-deep:#A33A2D; --das-deep:#B89A00;
  --der-soft:#1E2944; --die-soft:#3A2024; --das-soft:#3A3313;
    --das-ink:#F7D21E;
  --lift:0 14px 30px rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.2);
  --blob-a:rgba(255,120,181,.16); --blob-b:rgba(155,77,219,.20); --blob-c:rgba(255,184,31,.08);
  --glass:rgba(255,255,255,.06); --slot-line:rgba(200,160,240,.35);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,var(--ground),var(--ground-2));background-color:var(--ground);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
button:disabled{cursor:default}

/* ---------- floating background ---------- */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(40px);animation:drift 22s ease-in-out infinite alternate}
.blob.a{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:var(--blob-a)}
.blob.b{width:40vmax;height:40vmax;right:-12vmax;top:30vh;background:var(--blob-b);animation-duration:27s}
.blob.c{width:30vmax;height:30vmax;left:30vw;bottom:-16vmax;background:var(--blob-c);animation-duration:31s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4vmax,3vmax) scale(1.12)}}

/* ---------- shared ---------- */
.screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-inline:16px;padding-block:12px 20px;max-width:1000px;margin:0 auto;gap:12px}
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;min-height:60px}
.bar-mid{display:flex;justify-content:center;align-items:center;gap:10px;min-width:0}
.bar-end{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:8px;height:52px;padding-inline:16px;border-radius:999px;background:var(--surface);
  box-shadow:var(--lift);font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.pill .s{color:var(--star);font-size:28px}
.pill img{width:34px;height:34px;border-radius:10px}
.icon-btn{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:var(--lift)}
.icon-btn svg{width:24px;height:24px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vw,24px);width:100%;max-width:820px;margin-inline:auto}
.sym{width:.5em;height:.5em;flex:none}
.tile{background:var(--paper);border-radius:24%;overflow:hidden;display:block}
.pic{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:darken}
.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.25)}}
.warn{background:var(--die);color:var(--on-color);font-weight:800;font-size:14px;border-radius:999px;padding:8px 14px}

/* 3D candy buttons */
.candy{position:relative;display:grid;place-items:center;color:var(--on-color);border-radius:50%;transition:transform .12s, box-shadow .12s}
.candy:active:not(:disabled){transform:translateY(6px) scale(.97)}
.candy.grape{background:radial-gradient(circle at 35% 30%,#C288F2,var(--grape) 60%);box-shadow:0 10px 0 var(--grape-deep),var(--lift)}
.candy.grape:active:not(:disabled){box-shadow:0 4px 0 var(--grape-deep)}
.candy.pink{background:radial-gradient(circle at 35% 30%,#FFB3D6,var(--pink) 60%);box-shadow:0 9px 0 var(--pink-deep),var(--lift)}
.candy.pink:active:not(:disabled){box-shadow:0 3px 0 var(--pink-deep)}
.candy:disabled{opacity:.45}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:clamp(12px,2.4vh,24px);min-height:0}
.hero{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(18px,4vw,40px)}
.play{width:clamp(128px,21vmin,180px);aspect-ratio:1;animation:breathe 2.6s ease-in-out infinite}
.play svg{width:44%;height:44%;margin-left:8%}
.quizbtn{width:clamp(92px,14vmin,120px);aspect-ratio:1}
.quizbtn svg{width:52%;height:52%}
.quizbtn .due{position:absolute;top:-4px;right:-4px;width:34px;height:34px;border-radius:50%;background:var(--star);color:var(--ink);
  font-family:var(--display);font-weight:800;font-size:22px;display:grid;place-items:center;box-shadow:0 0 0 4px var(--ground);animation:wiggle 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.nextsticker{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:var(--lift)}
.nextsticker{flex-direction:column;border-radius:28px;padding:12px 14px;gap:8px}
#slots{display:flex;align-items:center;gap:8px}
.meter{display:block;width:clamp(120px,22vmin,200px);height:22px;border-radius:999px;background:var(--grape-soft);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.meter .fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--grape));transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.gift img{width:100%;height:100%;object-fit:contain;filter:brightness(0);opacity:.28}
.nextsticker{flex-direction:row!important;gap:12px!important;padding:8px 10px 8px 18px!important;border-radius:999px!important}
.ns{font-size:clamp(24px,3.6vmin,32px);color:var(--line);line-height:1;transition:color .3s}
.ns.on{color:var(--star);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.nextsticker .gift{width:64px;height:64px;overflow:hidden;border-radius:50%;background:var(--grape-soft);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--grape);font-size:22px}
.house{display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:0}
.house-top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px 6px}
.house-img{width:min(78%,clamp(88px,15vmin,136px));animation:float 3.4s ease-in-out infinite}
.house[data-a="die"] .house-img{animation-delay:-1.1s} .house[data-a="das"] .house-img{animation-delay:-2.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.label{display:inline-flex;align-items:center;gap:.25em;font-family:var(--display);font-weight:800;font-size:clamp(24px,4vmin,36px);line-height:1}
.label.der{color:var(--der)} .label.die{color:var(--die)} .label.das{color:var(--das-ink)}
.label .sym{width:.58em;height:.58em}
.rooms{border-radius:24px;padding:8px;min-height:clamp(60px,10vmin,90px);display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:6px}
.house[data-a="der"] .rooms{background:var(--der-soft)} .house[data-a="die"] .rooms{background:var(--die-soft)} .house[data-a="das"] .rooms{background:var(--das-soft)}
.w{position:relative;border-radius:16px;transition:opacity .2s}
.w .tile{width:clamp(44px,7vmin,62px);height:clamp(44px,7vmin,62px)}
.w.learning{opacity:.45}
.w.mastered::after{content:"★";position:absolute;right:-4px;top:-6px;font-size:18px;color:var(--star);text-shadow:0 1px 0 var(--star-deep)}
.w .txt{font-family:var(--display);font-size:15px;font-weight:700;padding:6px}
.w .emo{font-size:clamp(30px,5vmin,42px);line-height:1;padding:4px}
.empty{color:var(--muted);font-size:15px;padding:8px}

/* ---------- play & quiz ---------- */
.dots{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);transition:background .25s,transform .25s}
.dot.now{transform:scale(1.4);box-shadow:inset 0 0 0 3px var(--grape)}
.dot.der{background:var(--der);box-shadow:none} .dot.die{background:var(--die);box-shadow:none} .dot.das{background:var(--das);box-shadow:none}
.dot.ok{background:var(--star);box-shadow:none} .dot.miss{background:var(--pink);box-shadow:none}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:16px;min-height:0}
.card{position:relative;width:min(100%,620px);flex:1;max-height:470px;min-height:0;background:var(--paper);border-radius:40px;box-shadow:var(--lift);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;box-sizing:border-box;transition:box-shadow .25s}
.card.der{box-shadow:0 0 0 8px var(--der),var(--lift)} .card.die{box-shadow:0 0 0 8px var(--die),var(--lift)} .card.das{box-shadow:0 0 0 8px var(--das),var(--lift)}
.card.enter{animation:cardin .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardin{from{transform:translateY(40px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.card-pic{width:min(76%,330px);aspect-ratio:1;max-height:70%;min-height:0}
.card-pic .pic{animation:arrive .55s cubic-bezier(.2,1.5,.4,1) both .1s}
@keyframes arrive{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.emoji{font-size:clamp(96px,24vmin,210px);line-height:1.05}
.emoji.text{font-family:var(--display);font-weight:800;font-size:clamp(48px,10vmin,90px);color:#3B2352}
.caption{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.4vmin,58px);line-height:1;min-height:1em;visibility:hidden;color:#3B2352}
.caption.show{visibility:visible;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.caption .art.der{color:var(--der)} .caption .art.die{color:var(--die)} .caption .art.das{color:var(--das-ink)}
.listen{position:absolute;right:16px;top:16px;width:64px;height:64px;border-radius:50%;background:var(--surface);box-shadow:var(--lift);display:grid;place-items:center;color:var(--grape)}
.listen svg{width:30px;height:30px}
.mila-btn{overflow:hidden;background:var(--paper)!important;padding:0}
.listen.mila-btn{width:78px;height:78px}
.mila-face{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 90%}
.mila-home{width:clamp(90px,15vmin,130px);aspect-ratio:1;border-radius:50%;background:var(--paper);box-shadow:var(--lift);overflow:hidden;animation:bob 2.6s ease-in-out infinite}
.mila-home .mila-face{padding:6px;box-sizing:border-box}
body.talking .mila-face{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-5%) rotate(3deg) scale(1.04)}}
.kid{position:absolute;transform:translate(-50%,-100%) translateZ(34px);background:none;padding:0}
.kid img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 5px rgba(60,30,40,.25))}
.yay{position:absolute;left:16px;top:16px;width:clamp(84px,14vmin,124px);aspect-ratio:1;pointer-events:none;z-index:2}
.yay .tile{width:100%;height:100%;box-shadow:var(--lift)}
.yay .fallback{display:grid;place-items:center;width:100%;height:100%;font-size:clamp(52px,9vmin,80px)}
.yay.show{animation:yay .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes yay{from{transform:scale(.2) rotate(-35deg);opacity:0}to{transform:none;opacity:1}}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;min-height:clamp(100px,17vmin,150px);border-radius:32px;color:var(--on-color);
  font-family:var(--display);font-weight:800;font-size:clamp(36px,7.2vmin,66px);line-height:1;transition:transform .12s,opacity .25s,box-shadow .12s}
.choice.orb{display:grid;place-items:center;justify-self:center;width:min(100%,clamp(112px,19vmin,172px));min-height:0;border-radius:50%;padding:0}
.choice:active:not(:disabled){transform:translateY(6px) scale(.95)}
.choices.enter .choice{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.choices.enter .choice:nth-child(2){animation-delay:.07s} .choices.enter .choice:nth-child(3){animation-delay:.14s}
.choices.wait .choice{opacity:.5}
.choice.wrong{opacity:.22;animation:shake .45s}
.choice.right{transform:scale(1.06)}
.choice.hint{animation:pulse 1s ease-in-out infinite}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{translate:0}20%{translate:-12px}40%{translate:10px}60%{translate:-7px}80%{translate:4px}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.repeat{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,28px);width:100%;max-width:820px;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.round{width:clamp(80px,13vmin,108px);aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--grape);box-shadow:0 7px 0 var(--line),var(--lift)}
.round svg{width:44%;height:44%}
.round:active{transform:translateY(5px)}
.sign{position:relative;width:clamp(96px,16vmin,140px);aspect-ratio:1;flex:none;animation:bob 1.6s ease-in-out infinite}
.sign .tile{width:100%;height:100%;box-shadow:var(--lift)}
.sign .fallback{display:grid;place-items:center;width:100%;height:100%;font-size:clamp(56px,10vmin,90px)}
.sign .badge{position:absolute;right:-6px;bottom:-6px;width:40%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:var(--on-color);box-shadow:0 0 0 4px var(--ground)}
.sign .badge .sym{width:52%;height:52%}
.sign[data-a="der"] .badge{background:var(--der)} .sign[data-a="die"] .badge{background:var(--die)} .sign[data-a="das"] .badge{background:var(--das);color:var(--on-das)}
.mouth{font-size:clamp(52px,9vmin,84px);line-height:1;animation:bob 1.4s ease-in-out infinite .3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.go{width:clamp(110px,20vmin,200px);height:clamp(96px,16vmin,140px);border-radius:32px;background:var(--grape);color:var(--on-color);display:grid;place-items:center;
  box-shadow:0 9px 0 var(--grape-deep),var(--lift);transition:opacity .3s,transform .12s}
.go svg{width:60px;height:60px}
.go:disabled{opacity:.3}
.go:not(:disabled){animation:nudge 1.2s ease-in-out infinite}
.go:active:not(:disabled){transform:translateY(6px);box-shadow:0 3px 0 var(--grape-deep)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
/* quiz houses */
.qhouse{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border-radius:30px;padding:10px 10px 12px;box-shadow:var(--lift);
  transition:transform .15s, box-shadow .2s, opacity .25s}
.qhouse .qorb{width:min(80%,118px);margin:10px 0 6px}
.qhouse:active:not(:disabled){transform:scale(.95)}
.qhouse.right{box-shadow:0 0 0 7px var(--star),var(--lift)}
.qhouse.hint{box-shadow:0 0 0 7px var(--star),var(--lift);animation:pulse 1s ease-in-out infinite}
.qhouse.wrong{animation:shake .45s;opacity:.4}
.qhouses.wait .qhouse{opacity:.55}
.flyer{position:fixed;z-index:30;pointer-events:none;border-radius:24px;overflow:hidden;background:var(--paper)}
.spark{position:fixed;z-index:31;pointer-events:none;font-size:22px;line-height:1;margin:-11px 0 0 -11px}

/* ---------- done / quiz result ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:0}
.star-img{width:clamp(130px,24vmin,210px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--paper);box-shadow:var(--lift);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both, bob 1.8s ease-in-out .6s infinite}
.big-star{font-size:clamp(110px,22vmin,190px);line-height:1;color:var(--star);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.earned{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vmin,70px);line-height:1;display:flex;align-items:center;gap:8px}
.earned .s{color:var(--star)}
.practised{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px}
.practised .item{position:relative;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.practised .tile{width:clamp(56px,9vmin,80px);height:clamp(56px,9vmin,80px);box-shadow:var(--lift)}
.practised .emo{font-size:clamp(34px,6vmin,52px)}
.practised .mark{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:800;color:var(--on-color);box-shadow:0 0 0 3px var(--ground)}
.practised .mark.ok{background:var(--star);color:#3B2352} .practised .mark.miss{background:var(--pink)}
.actions{display:flex;gap:20px;align-items:center}
.actions .candy{width:clamp(84px,14vmin,112px);aspect-ratio:1}
.actions .candy svg{width:44%;height:44%}
/* sticker reveal */
.reveal{display:block;position:relative;width:clamp(150px,26vmin,220px);aspect-ratio:1;perspective:900px;cursor:pointer}
.reveal .flip{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.reveal.open .flip{transform:rotateY(180deg)}

// The picture flies into the chosen button/house, like moving into its house.
function flyTo(from, to) {

  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  if (!a.width || !b.width) return;

function confetti() {
  if (RM()) return;
  const cv = $("confetti"), c2 = cv.getContext("2d");
  cv.hidden = false;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const cols = ["--pink", "--grape", "--star", "--der", "--das"].map(v => css.getPropertyValue(v).trim());
  const ps = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .38,
    vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, r: Math.random() * Math.PI,
    vr: (Math.random() - .5) * .3, s: 8 + Math.random() * 9, c: pick(cols), round: Math.random() < .35 }));
  const t0 = performance.now();

    c2.clearRect(0, 0, innerWidth, innerHeight);

      p.vy += .33; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      c2.save(); c2.translate(p.x, p.y); c2.rotate(p.r); c2.fillStyle = p.c;

      c2.restore();
    }
    if (t - t0 < 2800) requestAnimationFrame(frame); else { c2.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(t0);
}

/* ---------- practice round ---------- */
// Words leaving this week's list move to the bank, so they keep coming back for review.
function archiveWords(oldWords) {
  const current = new Set(state.words.map(w => w.id));
  const keep = state.bank.filter(w => !current.has(w.id) && !oldWords.some(o => o.id === w.id));
  state.bank = normalizeWords([...keep, ...oldWords.filter(w => !current.has(w.id))]);
}
// Older words for this round: the ones she struggled with always come back; words she knows only when due.
function reviewWords(max) {
  const t = today();
  const weakness = (w) => { const p = prog(w.id), q = p.q || {}; return (needsPractice(w) ? 100 : 0) + (q.w || 0) * 5 + (p.wrong || 0) * 2 - (p.box || 0) * 3; };
  const cand = state.bank.filter(w => needsPractice(w) || (prog(w.id).box || 0) < MASTERED || !prog(w.id).due || prog(w.id).due <= t);
  return shuffle(cand).sort((a, b) => weakness(b) - weakness(a)).slice(0, max);
}
const allWords = () => [...state.words, ...state.bank];
function startSession() {
  if (!state.words.length) return;
  const t = today();
  const pool = shuffle(state.words).map(w => ({ w, p: prog(w.id) }));
  pool.sort((a, b) => {
    const da = !a.p.due || a.p.due <= t ? 0 : 1, dbb = !b.p.due || b.p.due <= t ? 0 : 1;
    return (da - dbb) || ((needsPractice(b.w) ? 1 : 0) - (needsPractice(a.w) ? 1 : 0)) || (a.p.box - b.p.box);
  });
  const len = Math.max(3, Number(state.settings.sessionLength) || 8);
  const review = reviewWords(Math.min(REVIEW_SLOTS, Math.max(0, len - 3)));
  const n = Math.min(len - review.length, pool.length);
  const words = shuffle([...pool.slice(0, n).map(x => x.w), ...review]);
  S = { words, queue: words.map(w => w.id), done: {}, graded: {}, misses: {}, earned: 0, card: null };
  renderStars();
  show("play");
  nextCard();
}
function renderDots() {

  $("dots").innerHTML = S.words.map(w => '<span class="dot ' + (S.done[w.id] ? w.article : "") + (w.id === cur ? " now" : "") + '"></span>').join("");
}
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function nextCard() {
  while (S.queue.length && !S.words.find(w => w.id === S.queue[0])) S.queue.shift();
  if (!S.queue.length) return finishSession();
  const id = S.queue.shift();
  const w = S.words.find(x => x.id === id);
  const hinted = state.settings.sayFirst !== "new" || prog(w.id).box < MASTERED;
  S.card = { w, attempts: 0, locked: false, hinted, listening: true };
  setPicture($("cardPic"), $("emoji"), w);
  preload(S.words.find(x => x.id === S.queue[0]));
  $("caption").className = "caption"; $("caption").innerHTML = "";
  $("card").className = "card"; restart($("card"), "enter");
  $("yay").hidden = true;
  document.querySelectorAll(".choice").forEach(b => { b.disabled = false; b.className = "choice orb " + b.dataset.a; });
  $("choices").hidden = false; restart($("choices"), "enter");
  $("repeat").hidden = true;
  renderDots();
  // Say it the right way first; taps are held until she has heard it.
  $("choices").classList.add("wait");
  const card = S.card;
  sleep(350).then(() => say(hinted ? [W(w)] : [C("f-wieheisst")], 0.75)).then(() => {

}
function requeue(id) {
  S.misses[id] = (S.misses[id] || 0) + 1;
  if (S.misses[id] > MAX_REQUEUE) { S.done[id] = true; return; }   // stop looping; it comes back next session
  S.queue.splice(Math.min(2, S.queue.length), 0, id);
}
function grade(id, clean) {
  if (id in S.graded) return;           // only the first time a word shows up counts for spacing
  S.graded[id] = clean;
  const p = prog(id);
  const patch = { seen: (p.seen || 0) + 1 };
  if (clean) { patch.box = Math.min(INTERVALS.length - 1, (p.box || 0) + 1); patch.due = addDays(today(), INTERVALS[patch.box]); }
  else { patch.box = 0; patch.due = today(); patch.wrong = (p.wrong || 0) + 1; }
  setProg(id, patch);
}
// Daily log for the grown-ups' weekly report: stars, practice rounds, quizzes, games, words said right.

}

/* ---------- quiz: picture only, no hints, one try per word ---------- */
function quizWords() {
  const practised = [...state.words.filter(w => (prog(w.id).seen || 0) > 0), ...reviewWords(2)];
  const pool = practised.length >= 3 ? practised : state.words;
  const rank = (w) => { const q = prog(w.id).q; if (!q) return -1e6; return (Date.parse(q.last) / 864e5 || 0) - (q.w || 0) * 2 + (q.ok === false ? -50 : 0); };
  return shuffle(shuffle(pool).sort((a, b) => rank(a) - rank(b)).slice(0, Math.min(QUIZ_SIZE, pool.length)));
}

/* ---------- stickers ---------- */
function awardStickers() {
  // Count only points gathered since the last sticker, so changing the setting never takes one away.
  const due = state.progress.stickers.length + Math.floor((state.progress.points - (state.progress.pointsUsed || 0)) / perSticker());
  const fresh = [];
  while (state.progress.stickers.length < due) {
    const next = STICKERS.find(s => !state.progress.stickers.includes(s));
    if (!next) break;
    state.progress.stickers.push(next); fresh.push(next);
    state.progress.pointsUsed = (state.progress.pointsUsed || 0) + perSticker();
  }
  return fresh;
}

/* ---------- colour help: just the circle and its article, no pictures or sentences ---------- */
// Tap Mila: each circle lights up in turn while she says its article: der (blue), die (red), das (yellow).
let chantOn = false;
async function playChant() {
  if (chantOn) return;
  chantOn = true;
  const box = $("chant"), items = [...box.querySelectorAll(".chant-item")];
  items.forEach(it => it.className = "chant-item");
  box.hidden = false;
  for (const it of items) {
    if (!chantOn) break;
    it.classList.add("on"); pop(); sparkle(it, 8);
    await say([C("a-" + it.dataset.a)], 0.8);
    await sleep(450);
    it.classList.remove("on"); it.classList.add("seen");
  }
  if (chantOn) await sleep(900);
  closeChant();
}
function closeChant() { chantOn = false; $("chant").hidden = true; }
$("chant").addEventListener("click", () => { stopAudio(); closeChant(); });

/* ---------- colour warm-up before practice: hear der/die/das, tap the colour ---------- */
const WARM_TAPS = 6;
function startPractice() {
  if (!state.words.length) return;
  if (state.settings.warmup === false) return startSession();
  let seq; do { seq = shuffle([...ARTS, ...ARTS]); } while (seq.some((a, i) => a === seq[i - 1]));   // no colour twice in a row
  WU = { seq: seq.slice(0, WARM_TAPS), i: 0, miss: false, locked: true, marks: [] };
  document.querySelectorAll(".worb").forEach(b => { b.className = "worb"; b.disabled = false; });
  renderWarmDots();
  show("warm");
  const my = WU;
  sleep(300).then(() => say([C("f-farben")])).then(() => { if (WU === my) warmPrompt(); });
}
function renderWarmDots() { $("warmDots").innerHTML = WU.seq.map((a, i) => '<span class="dot ' + (WU.marks[i] || "") + (i === WU.i ? " now" : "") + '"></span>').join(""); }
function warmPrompt() {
  if (!WU) return;
  if (WU.i >= WU.seq.length) return warmDone();
  WU.locked = true; WU.miss = false;
  document.querySelectorAll(".worb").forEach(b => b.className = "worb");
  $("warmOrbs").classList.add("wait");
  renderWarmDots();
  const my = WU;
  sleep(250).then(() => say([C("a-" + WU.seq[WU.i])], 0.8)).then(() => { if (WU === my) { WU.locked = false; $("warmOrbs").classList.remove("wait"); } });
}
function warmTap(b) {
  if (!WU || WU.locked) return;
  const a = WU.seq[WU.i];
  if (b.dataset.a === a) {
    WU.locked = true; chime(); b.classList.add("right"); sparkle(b, 10); cheer(a, b);
    WU.marks[WU.i] = (WU.miss ? "" : "warmok ") + a;
    WU.i++; renderWarmDots();
    const my = WU;
    say([C("a-" + a)]).then(() => sleep(250)).then(() => { if (WU === my) warmPrompt(); });
  } else {
    boop(); b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
    WU.miss = true; WU.locked = true;
    const right = document.querySelector('.worb[data-a="' + a + '"]');
    right.classList.add("hint"); sparkle(right, 10);
    const my = WU;
    say([C("a-" + a)], 0.8).then(() => { if (WU === my) WU.locked = false; });   // now she taps the right one
  }
}
function warmDone() {
  const perfect = WU.marks.every(m => m.startsWith("warmok"));
  WU = null;
  document.querySelectorAll(".worb").forEach(b => sparkle(b, 8));
  if (perfect) { chime(); addStars(); }
  say([C(perfect ? "p-super" : "p-toll")]).then(() => sleep(200)).then(() => { if (!$("warm").hidden) startSession(); });
}
document.querySelectorAll(".worb").forEach(b => b.addEventListener("click", () => warmTap(b)));
$("warmListen").addEventListener("click", () => { if (WU && WU.seq[WU.i]) say([C("a-" + WU.seq[WU.i])], 0.8); });
$("warmQuit").addEventListener("click", () => { WU = null; stopAudio(); renderHome(); show("home"); });

/* ---------- circle friends: jump and cheer ---------- */
function jump(el) { if (!el || RM() || !el.animate) return; el.animate([{ transform: "translateY(0)" }, { transform: "translateY(-26px) scale(1.1)" }, { transform: "translateY(0)" }], { duration: 480, easing: "cubic-bezier(.3,1.4,.5,1)" }); }
// The matching friend hops out of the button to cheer.
function cheer(a, anchor) {
  if (RM() || !anchor) return;
  const r = anchor.getBoundingClientRect();
  const f = document.createElement("span");
  f.className = "cheer orb " + a; f.innerHTML = FACE;
  document.body.appendChild(f);
  const w = Math.min(120, Math.max(80, r.height * .9));
  Object.assign(f.style, { left: (r.left + r.width / 2 - w / 2) + "px", top: (r.top - w * .75) + "px", width: w + "px" });
  f.animate([
    { transform: "translateY(60px) scale(.3)", opacity: 0 },
    { transform: "translateY(-30px) scale(1.1) rotate(-8deg)", opacity: 1, offset: .35 },
    { transform: "translateY(0) scale(1) rotate(6deg)", opacity: 1, offset: .6 },
    { transform: "translateY(-14px) scale(1) rotate(0)", opacity: 1, offset: .8 },
    { transform: "translateY(40px) scale(.6)", opacity: 0 }], { duration: 1500, easing: "ease-out" }).onfinish = () => f.remove();
}

/* ---------- garden: one new thing per day played ---------- */
const gardenCount = () => Math.min(GARDEN.length, state.progress.days.length);
function markDay() {
  const t = today();
  if (state.progress.days.includes(t)) return false;
  state.progress.days.push(t);
  if (state.progress.days.length > 120) state.progress.days.shift();
  return state.progress.days.length <= GARDEN.length;
}
function openGarden() {
  renderStars();
  const n = gardenCount(), seen = Math.min(state.progress.gardenSeen, n);
  $("gardenCount").textContent = n;
  const z = (y) => Math.round(10 + y * .6);           // things further forward stand out more when the island tilts
  const gi = (g, i) => '<button class="gi ' + (g.cls || "") + (i >= seen ? " new" : "") + '" data-g="' + g.id + '" style="left:' + g.x + "%;top:" + g.y + "%;width:" + g.w + "%;z-index:" + Math.round(g.y) + ";--z:" + z(g.y) + "px" +
    (i >= seen ? ";animation-delay:" + (0.5 + (i - seen) * 0.4) + "s" : "") + '"><img src="img/g-' + g.id + '.webp" alt="" data-garden="1"></button>';
  const next = GARDEN[n];
  $("garden").innerHTML = '<div class="island" id="island"><div class="floaty"><img class="base" src="img/island.webp" alt="">' +
    ARTS.map((a, i) => { const h = HOUSE_SPOTS[a]; return '<button class="ghouse" data-a="' + a + '" style="left:' + h.x + "%;top:" + h.y + "%;width:9%;z-index:" + h.y + ";--z:" + z(h.y) + 'px">' + ORB(a) + '<span class="gshadow"></span></button>'; }).join("") +
    GARDEN.slice(0, n).map(gi).join("") +
    KIDS.map(k => '<button class="kid" data-kid="' + k.id + '" style="left:' + k.x + "%;top:" + k.y + "%;width:" + k.w + "%;z-index:" + k.y + '"><img src="' + k.src + '" alt="" data-garden="1"></button>').join("") +
    (next ? '<div class="sprout" style="left:' + next.x + "%;top:" + Math.max(next.y, 30) + '%;z-index:' + Math.round(next.y) + '">🌱</div>' : "") +
    Array.from({ length: 10 }, (_, i) => '<span class="mote" style="left:' + (20 + Math.random() * 60) + "%;top:" + (40 + Math.random() * 35) + "%;animation-delay:" + (-Math.random() * 7) + 's"></span>').join("") +
    "</div></div>";
  show("gardenScreen");
  enableTilt();
  if (n > seen) {
    chime();
    setTimeout(() => { document.querySelectorAll(".gi.new").forEach(el => sparkle(el, 12)); say([C("f-garten")]); }, 1100);
    state.progress.gardenSeen = n; saveProgress();
  }
}
// Drag (or tilt the iPad) to turn the island a little in 3D; it springs back when let go.
let tiltWired = false;
function setTilt(rx, ry) { const el = $("island"); if (el) { el.style.setProperty("--rx", rx + "deg"); el.style.setProperty("--ry", ry + "deg"); } }
function enableTilt() {
  if (tiltWired) return; tiltWired = true;
  const g = $("garden"); let start = null;
  g.addEventListener("pointerdown", (e) => { start = { x: e.clientX, y: e.clientY }; $("island")?.classList.add("drag"); askOrientation(); });
  g.addEventListener("pointermove", (e) => {
    if (!start || RM()) return;
    const dx = (e.clientX - start.x) / g.clientWidth, dy = (e.clientY - start.y) / g.clientHeight;
    setTilt(Math.max(-14, Math.min(14, 8 - dy * 40)), Math.max(-22, Math.min(22, dx * 60)));
  });
  const end = () => { start = null; $("island")?.classList.remove("drag"); setTilt(0, 0); };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end); g.addEventListener("pointerleave", end);
  window.addEventListener("deviceorientation", (e) => {
    if (start || RM() || $("gardenScreen").hidden || e.beta == null) return;
    setTilt(Math.max(-10, Math.min(10, (e.beta - 45) / 4)), Math.max(-16, Math.min(16, (e.gamma || 0) / 2.5)));
  });
}
let orientAsked = false;
function askOrientation() {
  if (orientAsked) return; orientAsked = true;
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {}); } catch {}
}
$("garden").addEventListener("click", (e) => {
  const h = e.target.closest(".ghouse");
  if (h) { say([C("a-" + h.dataset.a)]); jump(h.querySelector(".orb")); sparkle(h, 8); return; }
  const k = e.target.closest(".kid");
  if (k) { pop(); jump(k.querySelector("img")); sparkle(k, 10); if (k.dataset.kid === "mila") say([C("f-hallo")]); return; }
  const g = e.target.closest(".gi");
  if (g) { pop(); jump(g.querySelector("img")); sparkle(g, 8); }
});

/* ---------- memory: find two pictures that live in the same house ---------- */
function startMemory() {
  const by = {}; for (const a of ARTS) by[a] = shuffle(state.words.filter(w => w.article === a));
  let cards = [];
  for (const a of ARTS) {
    const ws = by[a]; if (!ws.length) continue;
    const pairs = ws.length >= 4 ? 2 : 1;
    for (let i = 0; i < pairs * 2; i++) cards.push(ws[i % ws.length]);
  }
  while (cards.length > 12) cards.splice(cards.length - 2, 2);
  if (cards.length < 6) return;
  cards = shuffle(cards);
  M = { cards, open: [], matched: new Set(), pairs: cards.length / 2, found: 0, earned: 0, lock: false };
  $("mgrid").style.gridTemplateColumns = "repeat(" + (cards.length > 8 ? 4 : 3) + ",minmax(0,1fr))";
  $("mgrid").innerHTML = cards.map((w, i) => '<button class="mcard deal ' + w.article + '" data-i="' + i + '" style="animation-delay:' + (i * 0.05) + 's"><span class="in"><span class="f back">★</span><span class="f front">' + faceHTML(w) + "</span></span></button>").join("");
  renderMDots();
  renderStars();
  show("memory");
  say([C("f-paare")]);
}
function renderMDots() { $("mdots").innerHTML = Array.from({ length: M.pairs }, (_, i) => '<span class="dot' + (i < M.found ? " ok" : "") + '"></span>').join(""); }
$("mgrid").addEventListener("click", (e) => {
  const b = e.target.closest(".mcard"); if (!b || !M || M.lock) return;
  const i = Number(b.dataset.i);
  if (M.matched.has(i) || M.open.includes(i)) return;
  const w = M.cards[i];
  b.classList.add("up"); pop();
  say([W(w)]);
  M.open.push(i);
  if (M.open.length < 2) return;
  M.lock = true;
  const [x, y] = M.open, wx = M.cards[x], wy = M.cards[y];
  const cx = $("mgrid").children[x], cy = $("mgrid").children[y];
  if (wx.article === wy.article) {
    setTimeout(() => {
      M.matched.add(x); M.matched.add(y); M.open = []; M.found++; M.earned++;
      cx.classList.add("matched"); cy.classList.add("matched");
      chime(); cheer(wx.article, cy); sparkle(cx, 8); sparkle(cy, 8);
      addStars();
      renderMDots();
      M.lock = false;
      if (M.found === M.pairs) setTimeout(finishMemory, 1300);
    }, 700);
  } else {
    setTimeout(() => { boop(); cx.classList.remove("up"); cy.classList.remove("up"); M.open = []; M.lock = false; }, 1300);
  }
});
function finishMemory() {
  if (!M) return;
  const seen = new Set(), rows = [];
  for (const w of M.cards) if (!seen.has(w.id)) { seen.add(w.id); rows.push({ w, mark: "" }); }
  const earned = M.earned, grew = markDay(); logDay("g");
  M = null; lastActivity = "memory";
  state.progress.lastPlayed = today(); saveProgress();
  showDone(earned, rows, [], quizDue(), grew);
}

/* ---------- "Stimmt das?": a grown-up answers (sometimes wrong on purpose), she judges ---------- */
function startJudge() {
  if (state.words.length < 3) return;
  J = { words: shuffle(state.words).slice(0, Math.min(6, state.words.length)), i: 0, earned: 0, res: {}, phase: "", claim: "" };
  renderStars(); show("judge"); nextJudge(true);
}
function renderJDots() { $("jdots").innerHTML = J.words.map((w, i) => '<span class="dot ' + (w.id in J.res ? (J.res[w.id] ? "ok" : "miss") : "") + (i === J.i ? " now" : "") + '"></span>').join(""); }
function jTurn(who) { $("whoBig").classList.toggle("on", who === "big"); $("whoKid").classList.toggle("on", who === "kid"); }
function nextJudge(first) {
  if (J.i >= J.words.length) return finishJudge();
  const w = J.words[J.i];
  J.phase = "big"; J.claim = "";
  setPicture($("jPic"), $("jEmoji"), w);
  $("jCaption").className = "caption"; $("jCaption").innerHTML = "";
  $("jClaim").hidden = true;
  $("jcard").className = "card"; restart($("jcard"), "enter");
  document.querySelectorAll("#jChoices .choice").forEach(b => { b.disabled = false; b.className = "choice orb " + b.dataset.a; });
  $("jChoices").hidden = false; restart($("jChoices"), "enter");
  $("jThumbs").hidden = true;
  jTurn("big"); renderJDots();
  if (first) say([C("f-grosse")]);
}
function jReveal(w, ok) {
  $("jcard").className = "card " + w.article;
  $("jCaption").innerHTML = '<span class="art ' + w.article + '">' + w.article + "</span> " + esc(w.noun);
  $("jCaption").className = "caption show";
  J.res[w.id] = ok;
  if (ok) { J.earned++; addStars(); }
  renderJDots();
}
function jNext(spoken) { const my = J; spoken.then(() => sleep(900)).then(() => { if (J === my) { J.i++; nextJudge(false); } }); }
document.querySelectorAll("#jChoices .choice").forEach(btn => btn.addEventListener("click", () => {
  if (!J) return;
  const w = J.words[J.i], a = btn.dataset.a;
  if (J.phase === "big") {
    // grown-up's claim: shown as a coloured chip and said as a question; the right phrase always follows her judgement
    J.claim = a; J.phase = "kid";
    $("jClaim").className = "claim " + a;
    $("jClaim").innerHTML = '<span class="by">' + $("whoBig").innerHTML + '</span><svg class="sym" viewBox="0 0 20 20">' + SYMS[a] + "</svg>" + a;
    $("jClaim").hidden = false;
    $("jChoices").hidden = true;
    $("jThumbs").hidden = false; restart($("jThumbs"), "enter");
    jTurn("kid"); pop();
    say([Qs(w, a), C("f-stimmt")]);
  } else if (J.phase === "fix") {
    J.phase = "";
    document.querySelectorAll("#jChoices .choice").forEach(b => b.disabled = true);
    const ok = a === w.article;
    if (ok) { chime(); btn.classList.add("right"); cheer(a, btn); jReveal(w, true); jNext(say([C(pick(PRAISE)), W(w)])); }
    else { boop(); btn.classList.add("wrong"); document.querySelector('#jChoices .choice[data-a="' + w.article + '"]').classList.add("hint"); jReveal(w, false); jNext(say([C("f-schau"), W(w)])); }
  }
}));
function judge(saysRight) {
  if (!J || J.phase !== "kid") return;
  const w = J.words[J.i], claimRight = J.claim === w.article;
  $("jThumbs").hidden = true;
  if (saysRight && claimRight) { J.phase = ""; chime(); cheer(w.article, $("jcard")); jReveal(w, true); jNext(say([C("f-jastimmt"), W(w)])); }
  else if (!saysRight && !claimRight) {
    // she caught the mistake: now she shows the right house
    J.phase = "fix"; chime(); sparkle($("jClaim"), 10);
    document.querySelectorAll("#jChoices .choice").forEach(b => { b.disabled = b.dataset.a === J.claim; b.className = "choice orb " + b.dataset.a + (b.dataset.a === J.claim ? " wrong" : ""); });
    $("jChoices").hidden = false; restart($("jChoices"), "enter");
    say([C("f-nein"), C("f-welche")]);
  } else { J.phase = ""; boop(); jReveal(w, false); jNext(say([C("f-oh"), C("f-schau"), W(w)])); }
}
$("jYes").addEventListener("click", () => judge(true));
$("jNo").addEventListener("click", () => judge(false));
$("jListen").addEventListener("click", () => {
  if (!J || !J.words[J.i]) return;
  const w = J.words[J.i];
  if (J.phase === "") say([W(w)]); else if (J.phase === "kid") say([Qs(w, J.claim), C("f-stimmt")]); else say([C("f-grosse")]);
});
function finishJudge() {
  const rows = J.words.map(w => ({ w, mark: J.res[w.id] ? "ok" : "miss" }));
  const earned = J.earned, grew = markDay(); logDay("g");
  J = null; lastActivity = "judge";
  state.progress.lastPlayed = today(); saveProgress();
  showDone(earned, rows, [], quizDue(), grew);
}

/* ---------- story of the week ---------- */
function colourText(t) {
  return esc(t).split(/(\s+)/).map(tok => { const a = tok.toLowerCase().replace(/[^a-zäöüß]/g, ""); return ARTS.includes(a) ? '<span class="wd ' + a + '">' + tok + "</span>" : tok; }).join("");
}
function startStory() {
  const st = state.stories[state.stories.length - 1];
  if (!st) return;
  ST = { st, i: 0, asked: {} };
  renderStars(); show("story"); showPage();
}
function showPage() {
  const pg = ST.st.pages[ST.i];
  $("sdots").innerHTML = ST.st.pages.map((_, i) => '<span class="dot' + (i < ST.i ? " ok" : "") + (i === ST.i ? " now" : "") + '"></span>').join("");
  $("spage").innerHTML = '<img src="' + esc(pg.img) + '" alt="">';
  restart($("spage"), "turn-in");
  $("stext").innerHTML = colourText(pg.text);
  $("sPrev").disabled = ST.i === 0;
  $("squiz").hidden = true; $("snav").hidden = false;
  const my = ST, idx = ST.i;
  readPage().then(() => { if (ST === my && ST.i === idx && pg.q && !(idx in ST.asked)) askStory(pg.q); });
}
function readPage() {
  const pg = ST.st.pages[ST.i], my = ST, idx = ST.i;
  const words = [...$("stext").querySelectorAll(".wd")];
  words.forEach((el, k) => setTimeout(() => { if (ST === my && ST.i === idx) { el.classList.add("hi"); setTimeout(() => el.classList.remove("hi"), 500); } }, 300 + k * 900));
  return say([{ key: pg.audio, text: pg.text }], 0.8);
}
// A question after some pages: she taps the right picture and hears it with its article.
const findWord = (id) => allWords().find(w => w.id === id) || normalizeWords(SAMPLE).find(w => w.id === id);
function askStory(q) {
  const choices = shuffle(q.choices.map(findWord).filter(Boolean));
  if (!choices.length) return;
  ST.asked[ST.i] = "open";
  $("snav").hidden = true;
  $("squiz").innerHTML = choices.map(w => '<button class="sq" data-id="' + esc(w.id) + '" aria-label="' + esc(w.noun) + '">' + faceHTML(w) + "</button>").join("");
  $("squiz").hidden = false;
  say([{ key: q.audio, text: q.text }]);
}
$("squiz").addEventListener("click", (e) => {
  const b = e.target.closest(".sq"); if (!b || !ST || ST.asked[ST.i] !== "open") return;
  const q = ST.st.pages[ST.i].q, right = findWord(q.answer), ok = b.dataset.id === q.answer;
  ST.asked[ST.i] = ok ? "ok" : "miss";
  const my = ST, idx = ST.i;
  const done = () => { if (ST === my && ST.i === idx) { $("squiz").hidden = true; $("snav").hidden = false; bump($("sNext")); } };
  if (ok) { chime(); b.classList.add("right"); cheer(right.article, b); sparkle(b, 12); addStars(); say([C(pick(PRAISE)), W(right)]).then(() => sleep(300)).then(done); }
  else {
    boop(); b.classList.add("wrong");
    const rb = $("squiz").querySelector('[data-id="' + q.answer + '"]'); if (rb) rb.classList.add("hint");
    say([C("f-schau"), W(right)]).then(() => sleep(500)).then(done);
  }
});
$("sNext").addEventListener("click", () => {
  if (!ST) return; pop();
  if (ST.i < ST.st.pages.length - 1) { ST.i++; showPage(); return; }
  const st = ST.st; ST = null; lastActivity = "story";
  state.progress.storySeen = st.id;
  addStars(2); logDay("g");
  const grew = markDay(); state.progress.lastPlayed = today(); saveProgress();
  showDone(2, [], [], false, grew);
});
$("sPrev").addEventListener("click", () => { if (ST && ST.i > 0) { pop(); ST.i--; showPage(); } });
$("sListen").addEventListener("click", () => { if (!ST) return; const pg = ST.st.pages[ST.i]; if (ST.asked[ST.i] === "open") say([{ key: pg.q.audio, text: pg.q.text }]); else readPage(); });
$("spage").addEventListener("click", () => { if (ST && ST.asked[ST.i] !== "open") readPage(); });

/* ---------- speak to the app: she says it, gets gentle feedback and hears herself ---------- */
// Needs the microphone, so it runs in the GitHub version only (the Claude page blocks it).
// Speech recognition on children is imperfect, so feedback is always kind: great / almost / didn't hear.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micStream = null, recorder = null, micBroken = false, srConflict = false, listening = false;
const micAllowed = () => !micBroken && state.settings.record !== false && !window.claude && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function stopRecording() { try { recorder && recorder.state === "recording" && recorder.stop(); } catch {} }
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function listenFor(ms) {                     // resolves to heard phrases, [] when silent, null when unavailable
  return new Promise((resolve) => {
    if (!SR) return resolve(null);
    let r; try { r = new SR(); } catch { return resolve(null); }
    r.lang = "de-DE"; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    const out = []; let done = false;
    const fin = (v) => { if (done) return; done = true; try { r.stop(); } catch {} resolve(v); };
    r.onresult = (e) => { for (const res of e.results) for (const alt of res) out.push(String(alt.transcript).toLowerCase()); fin(out); };
    r.onerror = (e) => { if (e.error === "audio-capture") srConflict = true; fin(e.error === "no-speech" ? [] : (e.error === "audio-capture" ? null : out)); };
    r.onend = () => fin(out);
    try { r.start(); } catch { fin(null); }
    setTimeout(() => fin(out), ms);
  });
}
function judgeSpeech(alts, w) {
  const noun = norm(w.noun);
  let heardNoun = false, heardArt = false;
  for (const t of alts) {
    const toks = t.split(/[^a-zäöüß]+/).filter(Boolean).map(norm);
    toks.forEach((x, i) => {
      if (x === noun || lev(x, noun) <= (noun.length > 4 ? 2 : 1)) { heardNoun = true; if (toks[i - 1] === w.article) heardArt = true; }
    });
  }
  return heardArt ? "great" : heardNoun ? "almost" : "none";
}
// Watches the microphone level while she records: true once she has made a clear sound, null when it can't measure.
function voiceMeter(stream) {
  let spoke = false, loud = 0, timer = 0, src = null;
  try {
    const ac = ctx(); src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    timer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let s = 0; for (const v of buf) s += v * v;
      if (Math.sqrt(s / buf.length) > 0.02) { if (++loud >= 3) spoke = true; } else loud = Math.max(0, loud - 1);
    }, 50);
  } catch { return { stop: () => null }; }
  return { stop: () => { clearInterval(timer); try { src.disconnect(); } catch {} return spoke; } };
}
function unlockNext() {
  if (!S || !S.card || !$("nextBtn").disabled) return;
  $("nextBtn").disabled = false; bump($("nextBtn"));
}
async function recordHer(w) {
  if (listening) return;
  listening = true;
  const btn = $("micBtn");
  let her = null, verdict = null, spoke = null;
  try {
    stopAudio();
    btn.classList.add("rec"); btn.classList.remove("invite"); tone([880], "sine", .08);
    // record her voice for playback (skipped if this device can't record and recognise at the same time)
    let recDone = Promise.resolve(null), meter = null;
    if (!srConflict && typeof MediaRecorder !== "undefined") {
      try {
        micStream = micStream || await navigator.mediaDevices.getUserMedia({ audio: true });
        meter = voiceMeter(micStream);
        const chunks = [];
        recorder = new MediaRecorder(micStream);
        recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        recDone = new Promise(r => recorder.onstop = () => r(chunks));
        recorder.start();
        setTimeout(stopRecording, 2600);
      } catch (e) { recDone = Promise.resolve(null); }
    }
    const heard = await listenFor(3200);
    stopRecording();
    spoke = meter ? meter.stop() : null;
    const chunks = await Promise.race([recDone, sleep(1500).then(() => null)]);
    btn.classList.remove("rec");
    if (chunks && chunks.length) {
      const data = await new Blob(chunks, { type: (recorder && recorder.mimeType) || "audio/mp4" }).arrayBuffer();
      her = await Promise.race([sleep(2500).then(() => null),
        new Promise((res) => { const pr = ctx().decodeAudioData(data, res, () => res(null)); if (pr && pr.catch) pr.catch(() => res(null)); })]);
    }
    verdict = heard === null ? null : judgeSpeech(heard, w);
  } catch (e) {
    console.warn("mic", e);
    btn.classList.remove("rec");
    if (!her && verdict === null) { micBroken = true; btn.hidden = true; listening = false; unlockNext(); return; }
  }
  const p = prog(w.id);
  if (S && S.card) S.card.tries++;
  // she spoke (the recogniser caught the word, or the mic heard her voice): let her go on; after 3 tries, don't keep her stuck
  const saidIt = verdict === "great" || verdict === "almost" || spoke === true || (spoke === null && verdict === null && her);
  if (saidIt || (S && S.card && S.card.tries >= 3)) unlockNext();
  if (verdict === "great") {
    chime(); cheer(w.article, btn); sparkle(btn, 14);
    if (S && S.card && !S.card.spoke) { S.card.spoke = true; addStars(); }
    logDay("s");
    setProg(w.id, { said: (p.said || 0) + 1 }); saveProgress();
    if (her) { await playBuffer(her); await sleep(200); }
    await say([C("f-supergesagt")]);
  } else if (verdict === "almost") {
    if (her) { await playBuffer(her); await sleep(200); }
    await say([C("f-fast"), W(w)]);
    btn.classList.add("invite");
  } else if (!saidIt) {
    await say([C("f-nichtgehoert")]);
    btn.classList.add("invite");
  } else {
    // she spoke but the recogniser missed the word: play her voice back next to Mila's
    await say([C("f-hoer")]);
    if (her) { await playBuffer(her); await sleep(250); }
    await say([W(w)]);
  }
  listening = false;
}

let dataApplied = false;
async function applyDataFiles() {
  if (dataApplied || !state.wordsLoaded) return;
  dataApplied = true;
  try {
    const r = await fetch("data/stories.json", { cache: "no-cache" });
    if (r.ok) { const d = await r.json(); if (Array.isArray(d.stories) && d.stories.length) state.stories = d.stories; }
  } catch {}
  try {
    const r = await fetch("data/words.json", { cache: "no-cache" });
    if (r.ok) {
      const d = await r.json();
      if (Number(d.version) > (Number(state.settings.listVersion) || 0) && Array.isArray(d.words) && d.words.length) {
        const old = state.words;
        state.words = normalizeWords(d.words);

        if (d.replace) state.bank = []; else archiveWords(old);
        state.settings.listVersion = Number(d.version);

}

function flash(text, err) { const m = $("msg"); if (m) { m.textContent = text; m.className = "msg" + (err ? " err" : ""); } }
function parseLines(text) {
  const out = [], bad = [];
  for (const raw of text.split(/\n+/)) {
    const line = raw.trim(); if (!line) continue;
    const [main, sent] = line.split("|");
    const m = main.trim().match(/^(der|die|das)\s+([A-Za-zÄÖÜäöüß-]+)\s*(.*)$/i);
    if (!m) { bad.push(line); continue; }
    const w = { article: m[1].toLowerCase(), noun: capNoun(m[2]), emoji: m[3].trim() || guessEmoji(m[2]) };
    if (sent && sent.trim()) w.s = sent.trim();
    out.push(w);
  }
  return { out, bad };
}

  if (act === "close") return closeGrown();
  if (act === "gate") { if (b.dataset.ok === "1") { gateOk = true; renderGrown(); } else renderGate(); return; }
  if (act === "art") { addArt = b.dataset.a; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.a === addArt)); return; }
  if (act === "add") return addOne();
  if (act === "testclip") { say([C("p-super"), { key: "w-hund", text: "der Hund" }]); return; }
  if (act === "testvoice") { say("der Hund, die Katze, das Haus"); return; }
  if (act === "hear") { const w = state.words.find(x => x.id === b.dataset.id); if (w) say([W(w)]); return; }
  if (act === "delbank") { state.bank = state.bank.filter(x => x.id !== b.dataset.id); return commitWords("Removed."); }
  if (act === "del") { state.words = state.words.filter(x => x.id !== b.dataset.id); return commitWords("Removed."); }
  if (act === "bulk" || act === "newlist") {
    const { out, bad } = parseLines($("bulk").value || "");
    if (!out.length) { renderGrown(); flash("Nothing to add. Write lines like: der Hund", true); return; }
    if (act === "newlist" && armed !== "newlist") { const keep = $("bulk").value; armed = "newlist"; renderGrown(); $("bulk").value = keep; return; }
    armed = "";
    if (act === "newlist") { const old = state.words; state.words = []; for (const w of out) state.words.push(w); archiveWords(old); state.words = []; }
    for (const w of out) { const i = state.words.findIndex(x => x.id === norm(w.noun)); if (i >= 0) state.words.splice(i, 1); state.words.push(w); }
    state.sample = false;
    await commitWords((act === "newlist" ? "New list: " : "Added ") + out.length + " words." + (bad.length ? " Skipped: " + bad.join(", ") : ""));
    return;
  }
  if (act === "reset") {
    if (armed !== "reset") { armed = "reset"; renderGrown(); return; }
    armed = ""; state.progress = blankProgress(); saveProgress(); renderGrown(); return;
  }
});
$("gearBtn").addEventListener("click", openGrown);
$("voiceWarn").addEventListener("click", openGrown);

/* ---------- boot ---------- */
if (hasTTS) {
  pickVoice();
  try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch {}
  waitForVoices(3000).then(pickVoice);
}
renderHome();
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { state.mode = "local"; loadLocal(); renderHome(); applyDataFiles(); if (grownOpen) renderGrown(); return; }
  state.db = db; state.mode = "online";
  const onErr = (e) => { state.dbError = "Online storage stopped responding. Reload the page."; console.warn(e); if (grownOpen) renderGrown(); };
  db.doc("lists/current").onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : null;
    state.words = normalizeWords(d && d.words);
    state.bank = normalizeWords(d && d.bank);
    state.sample = !!(d && d.sample);
    state.settings = { ...state.settings, ...((d && d.settings) || {}) };
    state.wordsLoaded = true;
    applyDataFiles();
    if (!busy()) renderHome();
    if (grownOpen && !document.activeElement?.matches?.("input,textarea,select")) renderGrown();
  }, onErr);
  db.doc("progress/main").onSnapshot((snap) => {
    if (progSaving || busy() || snap.metadata.hasPendingWrites) return;
    state.progress = normalizeProgress(snap.exists ? snap.data() : null);
    renderHome();
    if (grownOpen && !document.activeElement?.matches?.("input,textarea,select")) renderGrown();
  }, onErr);
})();
})();
</script>
