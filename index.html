<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --ground:#FCF0F7; --ground-2:#F1E4FB; --surface:#FFFFFF; --ink:#3B2352; --muted:#86709C; --line:#EBDDF3;
  --paper:#F1EEE6;
  --grape:#9B4DDB; --grape-deep:#6C2BAA; --grape-soft:#EFE2FC;
  --pink:#FF78B5; --pink-deep:#D24E8E; --pink-soft:#FFE1F0;
  --der:#2F9BE0; --die:#E2553F; --das:#F6DB2A;
  --der-deep:#1B6CA8; --die-deep:#A8372A; --das-deep:#C2A300;
  --der-soft:#DDEFFB; --die-soft:#FCE2DD; --das-soft:#FFF6C4;
  --der-hi:#A9DBF8; --die-hi:#F8B2A6; --das-hi:#FFF4A6;
  --das-ink:#8A6D00; --on-das:#3B2352;
  --star:#FF9F1C; --star-deep:#C96F00;
  --on-color:#FFFFFF;
  --lift:0 14px 30px rgba(92,38,130,.14), 0 2px 0 rgba(92,38,130,.06);
  --blob-a:rgba(255,120,181,.30); --blob-b:rgba(155,77,219,.24); --blob-c:rgba(255,184,31,.18);
  --glass:rgba(255,255,255,.55); --slot-line:rgba(155,77,219,.38);
  --display:"SchoolI Display","Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"SchoolI Body","Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1C1128; --ground-2:#27163A; --surface:#2F1E45; --ink:#F7EEFF; --muted:#B9A3CF; --line:#44305E;
    --grape:#B476F0; --grape-deep:#7B3BBF; --grape-soft:#33224D;
    --pink:#FF8CC2; --pink-deep:#C4477F; --pink-soft:#3E2140;
    --der:#4AAAE8; --die:#EC6A55; --das:#F6DB2A;
    --der-deep:#1F6FA8; --die-deep:#A33A2D; --das-deep:#B89A00;
    --der-soft:#1E2944; --die-soft:#3A2024; --das-soft:#3A3313;
    --das-ink:#F7D21E;
    --lift:0 14px 30px rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.2);
    --blob-a:rgba(255,120,181,.16); --blob-b:rgba(155,77,219,.20); --blob-c:rgba(255,184,31,.08);
    --glass:rgba(255,255,255,.06); --slot-line:rgba(200,160,240,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#1C1128; --ground-2:#27163A; --surface:#2F1E45; --ink:#F7EEFF; --muted:#B9A3CF; --line:#44305E;
  --grape:#B476F0; --grape-deep:#7B3BBF; --grape-soft:#33224D;
  --pink:#FF8CC2; --pink-deep:#C4477F; --pink-soft:#3E2140;
  --der:#4AAAE8; --die:#EC6A55; --das:#F6DB2A;
  --der-deep:#1F6FA8; --die-deep:#A33A2D; --das-deep:#B89A00;
  --der-soft:#1E2944; --die-soft:#3A2024; --das-soft:#3A3313;
    --das-ink:#F7D21E;
  --lift:0 14px 30px rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.2);
  --blob-a:rgba(255,120,181,.16); --blob-b:rgba(155,77,219,.20); --blob-c:rgba(255,184,31,.08);
  --glass:rgba(255,255,255,.06); --slot-line:rgba(200,160,240,.35);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,var(--ground),var(--ground-2));background-color:var(--ground);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
button:disabled{cursor:default}

/* ---------- floating background ---------- */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(40px);animation:drift 22s ease-in-out infinite alternate}
.blob.a{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:var(--blob-a)}
.blob.b{width:40vmax;height:40vmax;right:-12vmax;top:30vh;background:var(--blob-b);animation-duration:27s}
.blob.c{width:30vmax;height:30vmax;left:30vw;bottom:-16vmax;background:var(--blob-c);animation-duration:31s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4vmax,3vmax) scale(1.12)}}

/* ---------- shared ---------- */
.screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-inline:16px;padding-block:12px 20px;max-width:1000px;margin:0 auto;gap:12px}
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;min-height:60px}
.bar-mid{display:flex;justify-content:center;align-items:center;gap:10px;min-width:0}
.bar-end{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:8px;height:52px;padding-inline:16px;border-radius:999px;background:var(--surface);
  box-shadow:var(--lift);font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.pill .s{color:var(--star);font-size:28px}
.pill img{width:34px;height:34px;border-radius:10px}
.icon-btn{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:var(--lift)}
.icon-btn svg{width:24px;height:24px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vw,24px);width:100%;max-width:820px;margin-inline:auto}
.sym{width:.5em;height:.5em;flex:none}
.tile{background:var(--paper);border-radius:24%;overflow:hidden;display:block}
.pic{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:darken}
.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.25)}}
.warn{background:var(--die);color:var(--on-color);font-weight:800;font-size:14px;border-radius:999px;padding:8px 14px}

/* 3D candy buttons */
.candy{position:relative;display:grid;place-items:center;color:var(--on-color);border-radius:50%;transition:transform .12s, box-shadow .12s}
.candy:active:not(:disabled){transform:translateY(6px) scale(.97)}
.candy.grape{background:radial-gradient(circle at 35% 30%,#C288F2,var(--grape) 60%);box-shadow:0 10px 0 var(--grape-deep),var(--lift)}
.candy.grape:active:not(:disabled){box-shadow:0 4px 0 var(--grape-deep)}
.candy.pink{background:radial-gradient(circle at 35% 30%,#FFB3D6,var(--pink) 60%);box-shadow:0 9px 0 var(--pink-deep),var(--lift)}
.candy.pink:active:not(:disabled){box-shadow:0 3px 0 var(--pink-deep)}
.candy:disabled{opacity:.45}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:clamp(12px,2.4vh,24px);min-height:0}
.hero{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(18px,4vw,40px)}
.play{width:clamp(128px,21vmin,180px);aspect-ratio:1;animation:breathe 2.6s ease-in-out infinite}
.play svg{width:44%;height:44%;margin-left:8%}
.quizbtn{width:clamp(92px,14vmin,120px);aspect-ratio:1}
.quizbtn svg{width:60%;height:60%;filter:drop-shadow(0 2px 2px rgba(120,20,70,.25))}
.quizbtn .due{position:absolute;top:-4px;right:-4px;width:34px;height:34px;border-radius:50%;background:var(--star);color:var(--ink);
  font-family:var(--display);font-weight:800;font-size:22px;display:grid;place-items:center;box-shadow:0 0 0 4px var(--ground);animation:wiggle 1.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.nextsticker{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:var(--lift)}
.nextsticker{flex-direction:column;border-radius:28px;padding:12px 14px;gap:8px}
#slots{display:flex;align-items:center;gap:8px}
.meter{display:block;width:clamp(120px,22vmin,200px);height:22px;border-radius:999px;background:var(--grape-soft);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.meter .fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--grape));transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.gift img{width:100%;height:100%;object-fit:contain;transition:filter .6s,opacity .6s}
.nextsticker{flex-direction:row!important;gap:12px!important;padding:8px 10px 8px 18px!important;border-radius:999px!important}
.ns{font-size:clamp(24px,3.6vmin,32px);color:var(--line);line-height:1;transition:color .3s}
.ns.on{color:var(--star);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.nextsticker .gift{width:64px;height:64px;overflow:hidden;border-radius:50%;background:var(--grape-soft);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--grape);font-size:22px}
.house{display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:0}
.house-top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 10px 6px}
.house-img{width:min(78%,clamp(88px,15vmin,136px));animation:float 3.4s ease-in-out infinite}
.house[data-a="die"] .house-img{animation-delay:-1.1s} .house[data-a="das"] .house-img{animation-delay:-2.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.label{display:inline-flex;align-items:center;gap:.25em;font-family:var(--display);font-weight:800;font-size:clamp(24px,4vmin,36px);line-height:1}
.label.der{color:var(--der)} .label.die{color:var(--die)} .label.das{color:var(--das-ink)}
.label .sym{width:.58em;height:.58em}
.rooms{border-radius:24px;padding:8px;min-height:clamp(60px,10vmin,90px);display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:6px}
.house[data-a="der"] .rooms{background:var(--der-soft)} .house[data-a="die"] .rooms{background:var(--die-soft)} .house[data-a="das"] .rooms{background:var(--das-soft)}
.w{position:relative;border-radius:16px;transition:opacity .2s}
.w .tile{width:clamp(44px,7vmin,62px);height:clamp(44px,7vmin,62px)}
.w.learning{opacity:.45}
.w.mastered::after{content:"★";position:absolute;right:-4px;top:-6px;font-size:18px;color:var(--star);text-shadow:0 1px 0 var(--star-deep)}
.w .txt{font-family:var(--display);font-size:15px;font-weight:700;padding:6px}
.w .emo{font-size:clamp(30px,5vmin,42px);line-height:1;padding:4px}
.empty{color:var(--muted);font-size:15px;padding:8px}

/* ---------- play & quiz ---------- */
.dots{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);transition:background .25s,transform .25s}
.dot.now{transform:scale(1.4);box-shadow:inset 0 0 0 3px var(--grape)}
.dot.der{background:var(--der);box-shadow:none} .dot.die{background:var(--die);box-shadow:none} .dot.das{background:var(--das);box-shadow:none}
.dot.ok{background:var(--star);box-shadow:none} .dot.miss{background:var(--pink);box-shadow:none}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:16px;min-height:0}
.card{position:relative;width:min(100%,620px);flex:1;max-height:470px;min-height:0;background:var(--paper);border-radius:40px;box-shadow:var(--lift);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;box-sizing:border-box;transition:box-shadow .25s}
.card.der{box-shadow:0 0 0 8px var(--der),var(--lift)} .card.die{box-shadow:0 0 0 8px var(--die),var(--lift)} .card.das{box-shadow:0 0 0 8px var(--das),var(--lift)}
.card.enter{animation:cardin .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardin{from{transform:translateY(40px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.card-pic{width:min(76%,330px);aspect-ratio:1;max-height:70%;min-height:0}
.card-pic .pic{animation:arrive .55s cubic-bezier(.2,1.5,.4,1) both .1s}
@keyframes arrive{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.emoji{font-size:clamp(96px,24vmin,210px);line-height:1.05}
.emoji.text{font-family:var(--display);font-weight:800;font-size:clamp(48px,10vmin,90px);color:#3B2352}
.caption{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.4vmin,58px);line-height:1;min-height:1em;visibility:hidden;color:#3B2352}
.caption.show{visibility:visible;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.caption .art.der{color:var(--der)} .caption .art.die{color:var(--die)} .caption .art.das{color:var(--das-ink)}
.listen{position:absolute;right:16px;top:16px;width:64px;height:64px;border-radius:50%;background:var(--surface);box-shadow:var(--lift);display:grid;place-items:center;color:var(--grape)}
.listen svg{width:30px;height:30px}
.mila-btn{overflow:hidden;background:var(--paper)!important;padding:0}
.listen.mila-btn{width:78px;height:78px}
.mila-face{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 90%}
.mila-home{width:clamp(90px,15vmin,130px);aspect-ratio:1;border-radius:50%;background:var(--paper);box-shadow:var(--lift);overflow:hidden;animation:bob 2.6s ease-in-out infinite}
.mila-home .mila-face{padding:6px;box-sizing:border-box}
body.talking .mila-face{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-5%) rotate(3deg) scale(1.04)}}
.kid{position:absolute;transform:translate(-50%,-100%) translateZ(34px);background:none;padding:0}
.kid img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 5px rgba(60,30,40,.25))}
.yay{position:absolute;left:16px;top:16px;width:clamp(84px,14vmin,124px);aspect-ratio:1;pointer-events:none;z-index:2}
.yay .tile{width:100%;height:100%;box-shadow:var(--lift)}
.yay .fallback{display:grid;place-items:center;width:100%;height:100%;font-size:clamp(52px,9vmin,80px)}
.yay.show{animation:yay .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes yay{from{transform:scale(.2) rotate(-35deg);opacity:0}to{transform:none;opacity:1}}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;min-height:clamp(100px,17vmin,150px);border-radius:32px;color:var(--on-color);
  font-family:var(--display);font-weight:800;font-size:clamp(36px,7.2vmin,66px);line-height:1;transition:transform .12s,opacity .25s,box-shadow .12s}
.choice.orb{display:grid;place-items:center;justify-self:center;width:min(100%,clamp(112px,19vmin,172px));min-height:0;border-radius:50%;padding:0}
.choice:active:not(:disabled){transform:translateY(6px) scale(.95)}
.choices.enter .choice{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.choices.enter .choice:nth-child(2){animation-delay:.07s} .choices.enter .choice:nth-child(3){animation-delay:.14s}
.choices.wait .choice{opacity:.5}
.choice.wrong{opacity:.22;animation:shake .45s}
.choice.right{transform:scale(1.06)}
.choice.hint{animation:pulse 1s ease-in-out infinite}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{translate:0}20%{translate:-12px}40%{translate:10px}60%{translate:-7px}80%{translate:4px}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.repeat{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,28px);width:100%;max-width:820px;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.round{width:clamp(80px,13vmin,108px);aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--grape);box-shadow:0 7px 0 var(--line),var(--lift)}
.round svg{width:44%;height:44%}
.round:active{transform:translateY(5px)}
.sign{position:relative;width:clamp(96px,16vmin,140px);aspect-ratio:1;flex:none;animation:bob 1.6s ease-in-out infinite}
.sign .tile{width:100%;height:100%;box-shadow:var(--lift)}
.sign .fallback{display:grid;place-items:center;width:100%;height:100%;font-size:clamp(56px,10vmin,90px)}
.sign .badge{position:absolute;right:-6px;bottom:-6px;width:40%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:var(--on-color);box-shadow:0 0 0 4px var(--ground)}
.sign .badge .sym{width:52%;height:52%}
.sign[data-a="der"] .badge{background:var(--der)} .sign[data-a="die"] .badge{background:var(--die)} .sign[data-a="das"] .badge{background:var(--das);color:var(--on-das)}
.mouth{font-size:clamp(52px,9vmin,84px);line-height:1;animation:bob 1.4s ease-in-out infinite .3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.go{width:clamp(110px,20vmin,200px);height:clamp(96px,16vmin,140px);border-radius:32px;background:var(--grape);color:var(--on-color);display:grid;place-items:center;
  box-shadow:0 9px 0 var(--grape-deep),var(--lift);transition:opacity .3s,transform .12s}
.go svg{width:60px;height:60px}
.go:disabled{opacity:.3}
.go:not(:disabled){animation:nudge 1.2s ease-in-out infinite}
.go:active:not(:disabled){transform:translateY(6px);box-shadow:0 3px 0 var(--grape-deep)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
/* quiz houses */
.qhouse{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border-radius:30px;padding:10px 10px 12px;box-shadow:var(--lift);
  transition:transform .15s, box-shadow .2s, opacity .25s}
.qhouse .qorb{width:min(80%,118px);margin:10px 0 6px}
.qhouse:active:not(:disabled){transform:scale(.95)}
.qhouse.right{box-shadow:0 0 0 7px var(--star),var(--lift)}
.qhouse.hint{box-shadow:0 0 0 7px var(--star),var(--lift);animation:pulse 1s ease-in-out infinite}
.qhouse.wrong{animation:shake .45s;opacity:.4}
.qhouses.wait .qhouse{opacity:.55}
.flyer{position:fixed;z-index:30;pointer-events:none;border-radius:24px;overflow:hidden;background:var(--paper)}
/* ---------- feeding the circle friends: she can drag the picture into der, die or das ---------- */
#choices .choice.orb .eyes{top:17%;width:40%;height:17%}
#choices .choice.orb .cheeks{top:37%;width:80%}
#choices .choice.orb .ow{translate:0 14%}
.orb .eyes{transition:scale .18s}
.orb .eyes i{translate:var(--lx,0) var(--ly,0);transition:translate .16s ease-out}
.orb .mouth-o{position:absolute;left:50%;top:79%;width:19%;height:15%;translate:-50% 0;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,#F07A93 0 42%,#2A1838 44%);scale:0;transition:scale .18s cubic-bezier(.3,1.6,.5,1)}
.qorb .mouth-o{top:55%;width:20%;height:17%}
#choices .choice.orb{transition:transform .12s,opacity .25s,box-shadow .12s,scale .2s cubic-bezier(.3,1.6,.5,1)}
.qhouse .orb,.qhouse .smile{transition:scale .2s cubic-bezier(.3,1.6,.5,1),opacity .15s}
.hungry.choice,.hungry .orb{scale:1.14}
.hungry .eyes{scale:1.2}
.hungry .mouth-o{scale:1}
.hungry .smile{opacity:0}
.munch.choice,.munch .orb{animation:munch .8s ease both}
.munch .eyes i{animation:none;transform:scaleY(.22)}
@keyframes munch{0%{transform:none}15%{transform:scale(1.22,.82)}32%{transform:scale(.9,1.1)}50%{transform:scale(1.12,.9)}68%{transform:scale(.96,1.05)}84%{transform:scale(1.04,.97)}100%{transform:none}}
.feeding{position:fixed;z-index:40;margin:0;pointer-events:none;max-height:none;border-radius:24px;overflow:hidden;background:var(--paper);
  box-shadow:0 18px 30px -8px rgba(60,30,80,.45);transition:scale .16s cubic-bezier(.3,1.5,.5,1),rotate .16s}
.feeding,.feeding *{animation:none!important}
.held{visibility:hidden}
.card-pic,#emoji,#qEmoji{touch-action:none}
.card-pic img{-webkit-touch-callout:none;-webkit-user-drag:none}
.feedhand{position:fixed;z-index:45;font-size:clamp(46px,8vmin,70px);line-height:1;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(60,30,60,.35))}
.spark{position:fixed;z-index:31;pointer-events:none;font-size:22px;line-height:1;margin:-11px 0 0 -11px}

/* ---------- done / quiz result ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:0}
.star-img{width:clamp(130px,24vmin,210px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--paper);box-shadow:var(--lift);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both, bob 1.8s ease-in-out .6s infinite}
.big-star{font-size:clamp(110px,22vmin,190px);line-height:1;color:var(--star);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.earned{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vmin,70px);line-height:1;display:flex;align-items:center;gap:8px}
.earned .s{color:var(--star)}
.practised{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px}
.practised .item{position:relative;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.practised .tile{width:clamp(56px,9vmin,80px);height:clamp(56px,9vmin,80px);box-shadow:var(--lift)}
.practised .emo{font-size:clamp(34px,6vmin,52px)}
.practised .mark{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:800;color:var(--on-color);box-shadow:0 0 0 3px var(--ground)}
.practised .mark.ok{background:var(--star);color:#3B2352} .practised .mark.miss{background:var(--pink)}
.actions{display:flex;gap:20px;align-items:center}
.actions .candy{width:clamp(84px,14vmin,112px);aspect-ratio:1}
.actions .candy svg{width:44%;height:44%}
/* sticker reveal */
.reveal{display:block;position:relative;width:clamp(150px,26vmin,220px);aspect-ratio:1;perspective:900px;cursor:pointer}
.reveal .flip{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.reveal.open .flip{transform:rotateY(180deg)}
.reveal .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:32px;display:grid;place-items:center}
.reveal .front{background:radial-gradient(circle at 35% 30%,#FFB3D6,var(--pink) 55%,var(--grape));color:var(--on-color);font-family:var(--display);font-weight:800;font-size:90px;box-shadow:var(--lift);animation:wiggle 1s ease-in-out infinite}
.reveal .back{transform:rotateY(180deg);background:var(--paper);box-shadow:var(--lift);overflow:hidden}
.reveal .back::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,transparent 60%);transform:translateX(-120%)}
.reveal.open .back::after{animation:shine 1.2s ease .7s}
@keyframes shine{to{transform:translateX(120%)}}
.setdone{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.6vmin,30px);color:var(--ink);background:var(--surface);border-radius:999px;padding:6px 20px;box-shadow:0 0 0 4px var(--star),var(--lift);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.reveal .more{position:absolute;right:-8px;top:-8px;z-index:2;background:var(--star);color:#3B2352;font-family:var(--display);font-weight:800;font-size:20px;border-radius:999px;padding:4px 10px;box-shadow:0 0 0 3px var(--ground)}

/* ---------- sticker book ---------- */
.book{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:12px}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,15vmin,140px),1fr));gap:clamp(12px,2vw,20px);max-width:900px;margin:0 auto;padding:12px 6px}
.slot{aspect-ratio:1;border-radius:28px;display:grid;place-items:center}
.slot.empty{border:3px dashed var(--slot-line);color:var(--slot-line);font-family:var(--display);font-weight:800;font-size:44px;background:var(--glass);box-sizing:border-box}
.slot.got{background:var(--paper);box-shadow:var(--lift);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.slot.got .pic{border-radius:28px}
.slot.got:active{animation:wiggle .5s}
.slot.new{box-shadow:0 0 0 6px var(--star),var(--lift)}
.slot{position:relative}
.slot.hunt{background:var(--glass);border:3px dashed var(--slot-line);box-sizing:border-box;overflow:hidden}
.slot.hunt .pic{filter:grayscale(1) brightness(1.1);opacity:.28}
.slot.hunt .q{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px;color:var(--slot-line)}
.slot .slabel{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);white-space:nowrap;background:var(--surface);border-radius:999px;padding:2px 10px;font-family:var(--display);font-weight:800;font-size:clamp(13px,2vmin,16px);color:var(--ink);box-shadow:var(--lift)}
.slot .slabel .der{color:var(--der)} .slot .slabel .die{color:var(--die)} .slot .slabel .das{color:var(--das-ink)}
.book-grid{row-gap:clamp(22px,3vw,30px)}
.btabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 6px 0}
.btab{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);box-shadow:var(--lift);font-family:var(--display);font-weight:800;font-size:15px;color:var(--ink)}
.btab img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--paper)}
.btab.on{box-shadow:0 0 0 4px var(--sc),var(--lift)}
.btab.complete{background:linear-gradient(135deg,#FFF6D6,var(--surface))}
.bhead{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 6px 0;font-family:var(--display);font-weight:800;font-size:clamp(22px,4vmin,32px);color:var(--sc)}
.bh-done{font-size:.7em;color:var(--star-deep);background:var(--surface);border-radius:999px;padding:2px 12px;box-shadow:var(--lift)}
#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:40}

/* ---------- grown-ups ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(30,10,45,.5);display:flex;justify-content:center;align-items:flex-start;
  overflow-y:auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) 24px;-webkit-user-select:text;user-select:text}
.sheet{width:100%;max-width:660px;background:var(--surface);border-radius:26px;padding:20px 20px 24px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:22px;font-size:16px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1.1}
.sheet h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:800}
.sheet p{margin:0;line-height:1.5}
.note{background:var(--grape-soft);border-radius:14px;padding:12px 14px;color:var(--ink);font-size:15px}
.note.hot{background:var(--pink-soft)}
.btn{border-radius:12px;padding:10px 16px;font-weight:700;background:var(--grape-soft);color:var(--ink);min-height:44px}
.btn.primary{background:var(--grape);color:var(--on-color)}
.btn.danger{color:var(--die)}
.btn.danger.armed{background:var(--die);color:var(--on-color)}
.gate{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gate .q{font-family:var(--display);font-size:32px;font-weight:800}
.gate .opts{display:flex;gap:10px}
.gate .opts .btn{font-size:22px;min-width:72px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:44px 52px minmax(0,1fr) auto 44px 44px;align-items:center;gap:8px;padding-block:6px;border-bottom:1px solid var(--line)}
.row .e{font-size:28px;text-align:center}
.row .e .tile{width:44px;height:44px;border-radius:12px}
.chip{font-weight:800;font-size:14px;border-radius:999px;padding:4px 0;text-align:center;color:var(--on-color)}
.chip.der{background:var(--der)} .chip.die{background:var(--die)} .chip.das{background:var(--das);color:var(--on-das)}
.row .n{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.row .n small{display:block;font-weight:600;font-size:14px;color:var(--muted)}
.row .n .flag{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;color:var(--on-color);background:var(--pink-deep);border-radius:999px;padding:2px 8px;vertical-align:middle}
.stat{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pip{width:8px;height:8px;border-radius:50%;background:var(--line)} .pip.on{background:var(--star)}
.row .mini{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.row .mini svg{width:20px;height:20px}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.seg button{padding:8px 14px;font-weight:800;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"][data-a="der"]{background:var(--der);color:var(--on-color)}
.seg button[aria-pressed="true"][data-a="die"]{background:var(--die);color:var(--on-color)}
.seg button[aria-pressed="true"][data-a="das"]{background:var(--das);color:var(--on-das)}
input[type=text],textarea,select{font:inherit;font-size:17px;color:var(--ink);background:var(--ground);border:2px solid var(--line);border-radius:12px;padding:8px 12px;box-sizing:border-box;min-height:44px}
#addEmoji{width:64px;text-align:center;font-size:22px}
#addNoun{flex:1;min-width:140px}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
.small{font-size:14px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;font-variant-numeric:tabular-nums}
.stats b{font-size:20px;display:block}
.report{background:var(--grape-soft);border-radius:18px;padding:16px}
.wk-stats{gap:10px 22px}
.wk-chart{margin-top:14px}
.wk-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.wk-plot{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;height:120px;align-items:end;border-bottom:1px solid var(--line)}
.wk-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.wk-col span{position:absolute;bottom:-20px;font-size:12px;color:var(--muted)}
.wk-bar{width:62%;min-height:2px;background:var(--grape);border-radius:4px 4px 0 0;position:relative;cursor:default}
.wk-bar::after{content:attr(data-v);position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .15s}
.wk-col:hover .wk-bar::after,.wk-col:active .wk-bar::after,.wk-col:focus-within .wk-bar::after{opacity:1}
.wk-chart{padding-bottom:22px}
.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.msg{font-size:14px;font-weight:700;color:var(--grape);min-height:1.2em}
.msg.err{color:var(--die)}

/* ---------- games row ---------- */
.games{display:flex;justify-content:center;gap:clamp(14px,3vw,28px)}
.game{width:clamp(62px,10vmin,84px);aspect-ratio:1}
.game svg{width:50%;height:50%}
.game .due{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--star);color:#3B2352;font-family:var(--display);font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--ground);animation:wiggle 1.4s ease-in-out infinite}
.candy.sun{background:radial-gradient(circle at 35% 30%,#FFE59A,var(--star) 60%);box-shadow:0 8px 0 var(--star-deep),var(--lift);color:#5A3A00}
.candy.sun:active:not(:disabled){box-shadow:0 3px 0 var(--star-deep)}
.candy.mint{background:radial-gradient(circle at 35% 30%,#B8F0CF,#5BC98A 60%);box-shadow:0 8px 0 #2F9A5E,var(--lift)}
.candy.mint:active:not(:disabled){box-shadow:0 3px 0 #2F9A5E}

/* ---------- circle friends ---------- */
.house-top,.qhouse{position:relative}
.friend{position:absolute;pointer-events:none;display:block}
.cheer{position:fixed;z-index:32;pointer-events:none;width:clamp(80px,13vmin,120px)}

/* ---------- article circles: der blue, die red, das yellow, just like the school sheet ---------- */
.orb{--c:var(--der);--c2:var(--der-deep);--hi:var(--der-hi);position:relative;display:block;aspect-ratio:1;border-radius:50%;container-type:inline-size;
  background:radial-gradient(circle at 34% 28%,#fff 0 4%,var(--hi) 15%,var(--c) 50%,var(--c2) 100%);
  box-shadow:inset -.35em -.5em 1em rgba(0,0,0,.14),0 10px 16px -6px rgba(60,30,80,.4)}
.orb.die{--c:var(--die);--c2:var(--die-deep);--hi:var(--die-hi)}
.orb.das{--c:var(--das);--c2:var(--das-deep);--hi:var(--das-hi)}
.orb::before{content:"";position:absolute;left:17%;top:8%;width:40%;height:22%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0));transform:rotate(-25deg);pointer-events:none}
.orb::after{content:"";position:absolute;inset:-8%;border-radius:50%;border:3px dashed var(--c);opacity:.5;animation:spin 16s linear infinite;pointer-events:none}
.orb.die::after{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orb .eyes{position:absolute;left:50%;top:38%;width:42%;height:20%;transform:translateX(-50%);display:flex;justify-content:space-between}
.orb .eyes i{position:relative;width:27%;height:100%;border-radius:50%;background:#2A1838;animation:blink 5s infinite}
.orb .eyes i::after{content:"";position:absolute;left:22%;top:14%;width:40%;height:36%;border-radius:50%;background:#fff}
.orb.die .eyes i{animation-delay:-1.7s} .orb.das .eyes i{animation-delay:-3.3s}
.orb .cheeks{position:absolute;left:50%;top:56%;width:64%;height:10%;transform:translateX(-50%);display:flex;justify-content:space-between}
.orb .cheeks i{width:18%;height:100%;border-radius:50%;background:rgba(255,120,181,.55)}
.orb .smile{position:absolute;left:50%;top:57%;width:24%;height:12%;transform:translateX(-50%);border:solid #2A1838;border-width:0 0 4cqw;border-radius:0 0 50% 50%/0 0 100% 100%}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.orb .ow{position:relative;font-family:var(--display);font-weight:800;font-size:30cqw;line-height:1;color:#fff;text-shadow:0 .06em 0 var(--c2),0 .1em .3em rgba(0,0,0,.18)}
.orb.das .ow{color:#4A3A00;text-shadow:0 .05em 0 rgba(255,255,255,.7)}
.label .dotc{width:.62em;height:.62em;border-radius:50%;background:currentColor}

/* ---------- colour warm-up and Mila's der-die-das ---------- */
.warm-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.worb{display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform .15s,opacity .25s}
.worb .orb{width:min(88%,clamp(130px,24vmin,220px))}
.worb .label{font-size:clamp(30px,5vmin,46px)}
.worb:active:not(:disabled){transform:scale(.94)}
.warm-orbs.wait .worb{opacity:.55}
.worb.right .orb{animation:pulse .5s ease 1}
.worb.hint .orb{animation:pulse 1s ease-in-out infinite;box-shadow:0 0 0 8px var(--star),0 10px 16px -6px rgba(60,30,80,.4)}
.worb.wrong{animation:shake .45s}
.dot.warmok{box-shadow:0 0 0 3px var(--star)}
.chant{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(40,20,60,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chant-row{display:flex;gap:clamp(18px,5vw,56px);align-items:flex-end}
.chant-item{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:.35;transform:scale(.85);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.chant-item .orb{width:clamp(120px,22vmin,210px)}
.chant-item.on{opacity:1;transform:scale(1.12)}
.chant-item.seen{opacity:1;transform:scale(1)}

.kidpop{position:fixed;left:3vw;bottom:0;height:min(34vh,260px);z-index:34;pointer-events:none;transform-origin:50% 100%;
  filter:drop-shadow(0 8px 10px rgba(60,30,60,.3));animation:kidpop 2.3s cubic-bezier(.3,1.4,.5,1) both}
.kidpop.right{left:auto;right:3vw}
/* ---------- Sätze: the school's picture sentences (circle · picture · malt · circle · picture) ---------- */
.candy.peach{background:radial-gradient(circle at 35% 30%,#FFD3B8,#FF8E5E 60%);box-shadow:0 8px 0 #C95A2C,var(--lift)}
.candy.peach:active:not(:disabled){box-shadow:0 3px 0 #C95A2C}
.tstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);min-height:0;padding:0 12px}
.trow{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.6vw,22px);padding:clamp(10px,2.5vh,26px) clamp(8px,2.4vw,30px);
  background:var(--surface);border-radius:32px;box-shadow:var(--lift);max-width:100%}
.tsl{position:relative;display:grid;place-items:center;flex:none;transition:transform .2s,box-shadow .2s;border-radius:50%}
.tsl.circ{width:clamp(36px,min(13.6vw,11vh),100px);aspect-ratio:1}

.trow.enter{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}

.tsl.circ.none{visibility:hidden;width:clamp(8px,3vw,40px)}
.tsl.circ.empty{border-radius:50%;background:var(--paper);border:clamp(2px,.5vw,4px) dashed var(--muted);color:var(--muted);font-family:var(--display);font-weight:800;font-size:clamp(20px,min(6vw,5vh),46px)}
.tsl.circ.empty::before{content:"?"}
.tsl.circ.now{border-color:var(--star);color:var(--star-deep);animation:pulse 1s ease-in-out infinite;box-shadow:0 0 0 6px rgba(255,159,28,.25)}
.tsl.circ.filled .orb{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.tsl.tpic{width:clamp(48px,min(18.5vw,16vh),148px);aspect-ratio:1;border-radius:24px;background:var(--paper);overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.tsl.tpic .tile,.tsl.tpic .tile img,.tsl.tpic img.pic{width:100%;height:100%;object-fit:contain;border-radius:0}
.tsl.tpic .emo{font-size:clamp(48px,9vmin,84px)}
.tsl.verb{width:clamp(40px,min(15.5vw,13vh),116px);aspect-ratio:1;border-radius:24px;background:var(--paper);overflow:hidden;isolation:isolate}
.tsl.verb img{width:100%;height:100%;object-fit:contain}
.tsl.lit{transform:scale(1.08);box-shadow:0 0 0 6px var(--star),0 0 26px 6px rgba(255,196,60,.55);z-index:2}
.tsl.circ.lit{border-radius:50%}
.tdot{font-family:var(--display);font-weight:800;font-size:clamp(24px,min(7vw,6vh),60px);color:var(--ink);align-self:flex-end;line-height:1;margin-left:-4px}
.ttext{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.6vmin,44px);color:var(--ink);text-align:center;line-height:1.2;min-height:1.2em}
.ttext .gap{display:inline-block;min-width:2.2em;border-bottom:4px dashed var(--muted);color:transparent}
.ttext .der,.ttext .den{color:var(--der)} .ttext .die{color:var(--die)} .ttext .das{color:var(--das-ink)}
.ttext .w{transition:background .2s;border-radius:10px;padding:0 4px;white-space:nowrap;display:inline-block}
.ttext .w.lit{background:rgba(255,196,60,.35)}
.tpick{display:flex;justify-content:center;gap:clamp(18px,5vw,56px)}
.tpick .choice.orb{width:clamp(96px,16vmin,150px)}
.tctl{display:flex;align-items:center;gap:clamp(18px,4vw,36px)}
.tctl .go{width:clamp(96px,16vmin,160px);height:clamp(80px,13vmin,120px)}
.tctl .round{width:clamp(72px,11vmin,96px)}
.stoast{position:fixed;left:50%;top:14px;z-index:60;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 4px var(--star),var(--lift);
  font-family:var(--display);font-weight:800;font-size:clamp(18px,3vmin,24px);color:var(--ink);pointer-events:none;animation:stoast 2.6s cubic-bezier(.3,1.4,.5,1) both}
.stoast img{width:clamp(48px,8vmin,64px);height:clamp(48px,8vmin,64px);object-fit:contain}
@keyframes stoast{0%{transform:translate(-50%,-140%)}14%,82%{transform:translate(-50%,0)}100%{transform:translate(-50%,-140%)}}
@keyframes kidpop{0%{transform:translateY(105%)}16%{transform:translateY(0) rotate(-5deg)}28%{transform:translateY(-5%) rotate(4deg)}40%,82%{transform:translateY(0) rotate(0)}100%{transform:translateY(105%)}}

.stext .snarr,.stext .slines{display:block}
.stext.finding .slines{display:none}
.stext .sfind{display:inline-block;margin-top:.3em;font-size:.72em;padding:.12em .7em;border-radius:999px;background:var(--surface);box-shadow:0 0 0 3px var(--star),var(--lift);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.stext .slines{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;margin-top:.3em}
.stext .skid{display:inline-block;font-size:.62em;color:var(--grape);background:var(--surface);border-radius:999px;padding:.12em .6em;box-shadow:var(--lift);transition:transform .2s,box-shadow .2s}
.stext .skid.on{transform:scale(1.1);box-shadow:0 0 0 3px var(--grape),var(--lift)}
.stext .skid b{font-weight:800;opacity:.75}
.spage.finding{cursor:pointer;box-shadow:0 0 0 6px var(--star),var(--lift)}
.fring{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:6px solid var(--star);pointer-events:none;box-shadow:0 0 18px var(--star)}
.fring.hint{animation:fring 1.1s ease-in-out infinite}
.fring.got{animation:fpop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes fpop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.nb{white-space:nowrap}
@keyframes fring{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.9}50%{transform:translate(-50%,-50%) scale(1.18);opacity:.5}}
.fmiss{position:absolute;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%);border:4px solid rgba(255,255,255,.85);pointer-events:none;animation:fmiss .6s ease-out both}
@keyframes fmiss{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
.squiz.asking{align-items:center}
.squiz .askpic{animation:none;margin-right:clamp(6px,2vw,20px)}
.squiz.asking .choice.orb{flex:none;width:clamp(84px,14vmin,124px)}
.squiz.asking .askpic{width:clamp(84px,14vmin,124px)}

/* ---------- home: circles fill up as words get their star ---------- */
.orbwrap{position:relative;display:block;width:min(78%,clamp(88px,15vmin,136px));animation:float 3.4s ease-in-out infinite}
.orbwrap .house-img{width:100%;animation:none}
.house[data-a="die"] .orbwrap{animation-delay:-1.1s} .house[data-a="das"] .orbwrap{animation-delay:-2.2s}
.ring{--pct:0;position:absolute;inset:-13%;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--rc) calc(var(--pct) * 1%),rgba(120,90,150,.13) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));transition:--pct .6s}
.ring.der{--rc:var(--der)} .ring.die{--rc:var(--die)} .ring.das{--rc:var(--das-deep)}
.ring.full{filter:drop-shadow(0 0 8px var(--star))}
.house-top .orb::after{display:none}
.label .cnt{font-size:.5em;font-weight:800;color:var(--muted);margin-left:.35em;align-self:flex-end;margin-bottom:.15em}
.w.newstar{animation:newstar 1.1s cubic-bezier(.3,1.6,.5,1) both;opacity:1}
@keyframes newstar{0%{transform:scale(.4) rotate(-12deg);opacity:.3}45%{transform:scale(1.45) rotate(6deg);opacity:1;box-shadow:0 0 0 6px var(--star)}100%{transform:none}}

/* ---------- Schreiben: trace letters on the school's writing lines (the paper stays light, like the real sheet) ---------- */
.candy.teal{background:radial-gradient(circle at 35% 30%,#B5EEEA,#38BDB5 60%);box-shadow:0 8px 0 #1F8A84,var(--lift)}
.candy.teal:active:not(:disabled){box-shadow:0 3px 0 #1F8A84}
.game .glyph{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.4vmin,36px);line-height:1;letter-spacing:-.02em;margin-top:.12em}
.hstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.6vh,26px);min-height:0;padding:0 12px}
.hletter{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vmin,56px);line-height:1;color:var(--grape)}
.hpic{width:clamp(130px,26vmin,240px);aspect-ratio:1;border-radius:28px;background:var(--paper);box-shadow:0 0 0 3px var(--line),var(--lift);padding:0;overflow:hidden}
.hpic .tile,.hpic .tile img,.hpic img.pic{width:100%;height:100%;object-fit:contain;border-radius:0}
.hpic .emo{font-size:clamp(70px,14vmin,130px)}
.htiles{display:flex;gap:0;justify-content:center;max-width:100%}
/* puzzle tiles like the school sheet: each piece has a knob that fits into the next one */
.htile{position:relative;width:clamp(58px,min(15vw,11vh),104px);aspect-ratio:1.15;margin-right:clamp(6px,1.6vw,14px);border-radius:12px;background:var(--surface);
  border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(26px,min(7vw,5.4vh),48px);color:var(--ink);transition:transform .2s}
.htile:not(:last-child)::after{content:"";position:absolute;right:calc(-1 * clamp(6px,1.6vw,14px) - 10px);top:50%;width:20px;height:20px;translate:0 -50%;border-radius:50%;background:inherit;border:3px solid var(--ink);border-left-color:transparent;z-index:1}
.htile:active{transform:translateY(3px)}
.htile.ok{background:#FFE15A}
.htile.miss{animation:w-nope .5s}
.htile.miss::before{content:"";position:absolute;inset:18% 12%;background:linear-gradient(to top right,transparent 46%,var(--die) 47% 53%,transparent 54%);opacity:.75;pointer-events:none}
.htile.hint{box-shadow:0 0 0 6px var(--star);animation:pulse 1s ease-in-out infinite}
.htile .ch{opacity:0;transition:opacity .3s}
.htile.show .ch{opacity:1}
.htile.ok .ch{color:var(--grape)}
.htiles.pos .htile{width:clamp(78px,min(22vw,15vh),140px)}
.hword{font-family:var(--display);font-weight:800;font-size:clamp(28px,5.4vmin,46px);line-height:1;letter-spacing:.04em;color:var(--ink);min-height:1em;opacity:0;transition:opacity .3s}
.hword.show{opacity:1}
.hword b{color:var(--grape)}
.wpick{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(18px,4vw,40px);min-height:0}
.wtile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:clamp(14px,2.4vh,24px) clamp(18px,3vw,32px);border-radius:32px;background:var(--surface);box-shadow:0 8px 0 var(--line),var(--lift)}
.wtile:active{transform:translateY(5px);box-shadow:0 3px 0 var(--line),var(--lift)}
.wtile .pair{font-family:var(--display);font-weight:800;font-size:clamp(64px,13vmin,120px);line-height:1;color:var(--grape)}
.wtile .tile{width:clamp(64px,11vmin,96px);height:clamp(64px,11vmin,96px)}
.wtile .mark{position:absolute;right:-6px;top:-6px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--star);color:#3B2352;font-weight:800;box-shadow:0 0 0 3px var(--ground)}
.wstage{flex:1;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,20px);min-height:0}
.wcard{position:relative;flex:1;width:100%;min-height:0;border-radius:32px;background:#FFFDF7;box-shadow:var(--lift);overflow:hidden}
.wsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.wsvg .band{fill:#E6F4EA} .wsvg .ln{stroke:#9DB4C8;stroke-width:1.2} .wsvg .ln.base{stroke:#5F7F99;stroke-width:2}
.wsvg .track{fill:none;stroke:#DCD3E8;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.wsvg .track.dot{fill:#DCD3E8;stroke:none}
.wsvg .dotted{fill:none;stroke:#B9A7CF;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 9}
.wsvg .dotted.dot{fill:#B9A7CF;stroke:none}
.wink,.inked{fill:none;stroke:#8E3FC7;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.wink{stroke-width:6;opacity:.3}
circle.inked{fill:#8E3FC7;stroke:none}
.wsvg .inked.oops{stroke:#FF78B5;animation:wfade .7s ease .2s both}
@keyframes wfade{to{opacity:0}}
.wsvg .start circle{fill:#3DBE78;stroke:#fff;stroke-width:2.5}
.wsvg .start text{fill:#fff;font-family:var(--display);font-weight:800;font-size:13px;text-anchor:middle;dominant-baseline:central}
.wsvg .start.now circle{animation:wpulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wsvg .start.call circle{animation:wcall .5s ease 3;transform-box:fill-box;transform-origin:center}
@keyframes wpulse{50%{transform:scale(1.25)}}
@keyframes wcall{50%{transform:scale(1.7)}}
.wsvg .arrow{fill:#1E8E55;stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.wsvg .wpen{fill:var(--star);stroke:#fff;stroke-width:2.5}
.wcard.yay{box-shadow:0 0 0 6px var(--star),var(--lift)}
.wword{position:absolute;left:12px;top:12px;z-index:2}
.wword .tile{width:clamp(56px,10vmin,88px);height:clamp(56px,10vmin,88px);box-shadow:var(--lift)}
.practised .wthumb{display:block;width:clamp(56px,9vmin,80px);height:clamp(56px,9vmin,80px);border-radius:18px;background:#FFFDF7;box-shadow:var(--lift)}
.wthumb .ln{stroke:#9DB4C8;stroke-width:2} .wthumb path.inked{stroke-width:9}

/* ---------- circle games ---------- */
.candy.sky{background:radial-gradient(circle at 35% 30%,#C9E9FF,#6FB8EE 60%);box-shadow:0 8px 0 #3C85BD,var(--lift)}
.kidgame{overflow:hidden}
.kidgame img{width:92%;height:92%;object-fit:cover;object-position:50% 4%;border-radius:50%;margin-top:14%}
.games{flex-wrap:wrap}
.gmax{position:absolute;left:10px;bottom:6px;display:flex;align-items:flex-end;gap:4px;pointer-events:none}
.gmax img{height:clamp(120px,24vh,210px);filter:drop-shadow(0 6px 8px rgba(60,30,60,.3));transform-origin:50% 100%}
.gmax.enter img{animation:kidpop 1.2s cubic-bezier(.3,1.4,.5,1) both}
.gmax.talk img{animation:talk .5s ease 2}
@keyframes talk{50%{transform:rotate(-4deg) translateY(-6px)}}
.gmax .bubble{margin-bottom:clamp(90px,18vh,160px);padding:8px 16px;border-radius:22px 22px 22px 4px;background:var(--surface);box-shadow:var(--lift);font-family:var(--display);font-weight:800;font-size:clamp(22px,4vmin,34px);color:var(--ink);white-space:nowrap}
.gmax .bubble.der{color:var(--der)} .gmax .bubble.die{color:var(--die)} .gmax .bubble.das{color:var(--das-ink)}

/* ---------- printable cards ---------- */
.printsheet{position:fixed;inset:0;z-index:60;overflow:auto;background:#fff;color:#222;padding:16px}
.ptools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);max-width:190mm;margin:0 auto}
.pcard,.pin{box-sizing:border-box}
.pcard{height:88mm;padding:3mm;border:1px dashed #bbb;break-inside:avoid;page-break-inside:avoid}
.pin{height:100%;border:3.5mm solid var(--pc);border-radius:6mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4mm 2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pin.der{--pc:var(--der)} .pin.die{--pc:var(--die)} .pin.das{--pc:var(--das)}
.pin img{flex:1;min-height:0;width:100%;max-height:60mm;object-fit:contain}
.pemo{font-size:40mm;line-height:1}
.pword{display:flex;align-items:center;gap:2mm;font-family:var(--display);font-weight:800;font-size:19pt;color:#3B2352}
.pword i{width:5mm;height:5mm;border-radius:50%;background:var(--pc);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pword.der{--pc:var(--der)} .pword.die{--pc:var(--die)} .pword.das{--pc:var(--das)}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff!important}
  body>*:not(#printSheet){display:none!important}
  .printsheet{position:static;padding:0;overflow:visible}
  .ptools{display:none}
}

/* ---------- a wrong tap: the circle shakes its head, the right one calls her ---------- */
.oops{position:relative;animation:nope .75s ease both;opacity:.4;filter:saturate(.35)}
@keyframes nope{0%{transform:none;opacity:1;filter:none}15%{transform:rotate(-12deg) scale(.96)}35%{transform:rotate(10deg) scale(.94)}55%{transform:rotate(-7deg) scale(.92)}75%{transform:rotate(4deg) scale(.9)}100%{transform:scale(.88)}}
.oopsbadge{position:absolute;right:-6%;top:-10%;font-size:clamp(28px,5vmin,44px);line-height:1;filter:saturate(1) drop-shadow(0 3px 4px rgba(60,30,60,.35));animation:pop .45s .25s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none;z-index:2}
.callme{position:relative;z-index:3;animation:callme 1s ease-in-out infinite!important;opacity:1!important;filter:none!important}
.choice.callme,.worb.callme .orb,.qhouse.callme,.sq.callme{box-shadow:0 0 0 8px var(--star),0 0 34px 8px rgba(255,196,60,.7),var(--lift)!important}
@keyframes callme{0%,100%{transform:translateY(0) scale(1.06)}50%{transform:translateY(-9%) scale(1.14)}}
.fixhand{position:fixed;z-index:45;font-size:clamp(46px,8vmin,70px);line-height:1;pointer-events:none;transform:translateX(-30%);filter:drop-shadow(0 4px 6px rgba(60,30,60,.35));animation:fixhand .8s ease-in-out infinite}
@keyframes fixhand{0%,100%{margin-top:0}50%{margin-top:14px}}
.fixed{box-shadow:0 0 0 7px var(--star),var(--lift)}

/* ---------- story shelf ---------- */
.shelf{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,32px);justify-content:center;align-content:center;padding:12px 4px 20px}
.scard{position:relative;width:min(44vw,400px);border-radius:30px;background:var(--surface);box-shadow:var(--lift);overflow:hidden;display:flex;flex-direction:column;text-align:left;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transition:transform .15s}
.scard:nth-child(2){animation-delay:.08s} .scard:nth-child(3){animation-delay:.16s}
.scard:active{transform:scale(.97)}
.scard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.scard .stitle{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vmin,30px);line-height:1.15;padding:12px 16px 14px;color:var(--ink)}
.scard .stitle .der{color:var(--der)} .scard .stitle .die{color:var(--die)} .scard .stitle .das{color:var(--das-ink)}
.scard .snew{position:absolute;top:12px;right:12px;background:var(--star);color:#5A3A00;border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:800;font-size:clamp(16px,2.6vmin,22px);box-shadow:var(--lift);animation:pulse 1.4s ease-in-out infinite}

/* ---------- memory game ---------- */
.mwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2vw,18px);width:min(100%,760px,calc((100vh - 150px) * 1.3))}
.mcard{aspect-ratio:1;perspective:800px}
.mcard .in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:grid;place-items:center;overflow:hidden}
.mcard .back{background:radial-gradient(circle at 35% 30%,#FFB3D6,var(--pink) 55%,var(--grape));box-shadow:0 6px 0 var(--grape-deep),var(--lift);color:#fff;font-size:clamp(28px,5vmin,46px)}
.mcard .front{transform:rotateY(180deg);background:var(--paper);box-shadow:var(--lift)}
.mcard .front .tile{width:92%;height:92%}
.mcard .front .emo{font-size:clamp(40px,8vmin,70px)}
.mcard.der{--c:var(--der)} .mcard.die{--c:var(--die)} .mcard.das{--c:var(--das)}
.mcard.matched .front{box-shadow:0 0 0 6px var(--c),var(--lift)}
.mcard.matched{animation:pulse .5s ease 1}
.mcard.deal{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}

/* ---------- "Stimmt das?" ---------- */
.turn{display:flex;align-items:center;gap:14px;justify-content:center}
.who{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--lift);opacity:.35;transition:transform .3s,opacity .3s,box-shadow .3s;color:var(--grape)}
.who svg{width:60%;height:60%}
.who.on{opacity:1;transform:scale(1.18);box-shadow:0 0 0 4px var(--grape),var(--lift)}
.claim{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;color:var(--on-color);font-family:var(--display);font-weight:800;font-size:clamp(28px,5vmin,44px);line-height:1;box-shadow:var(--lift);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.claim.der{background:var(--der)} .claim.die{background:var(--die)} .claim.das{background:var(--das);color:var(--on-das)}
.claim .sym{width:.5em;height:.5em}
.claim .by{width:1.1em;height:1.1em;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center}
.claim .by svg{width:70%;height:70%}
.small .choice.orb{width:min(100%,clamp(84px,14vmin,124px))}
.thumbs{display:flex;gap:clamp(20px,5vw,48px);justify-content:center}
.thumb{width:clamp(120px,20vmin,170px);height:clamp(100px,16vmin,140px);border-radius:34px;font-size:clamp(54px,9vmin,84px);line-height:1}
.thumb.yes{background:radial-gradient(circle at 35% 30%,#C288F2,var(--grape) 60%);box-shadow:0 9px 0 var(--grape-deep),var(--lift)}
.thumb.no{background:radial-gradient(circle at 35% 30%,#FFB3D6,var(--pink) 60%);box-shadow:0 9px 0 var(--pink-deep),var(--lift)}
.thumb:active{transform:translateY(6px)}
.thumbs.enter .thumb{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both} .thumbs.enter .thumb:nth-child(2){animation-delay:.08s}

/* ---------- record her voice ---------- */
.mic{position:relative;width:clamp(96px,16vmin,130px)!important;background:var(--pink-soft);color:var(--pink-deep)}
.mic.invite{animation:breathe 1.4s ease-in-out infinite;box-shadow:0 7px 0 var(--pink-deep),0 0 0 6px var(--pink),var(--lift)}
.mic.rec{background:var(--pink);color:#fff}
.mic.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:5px solid var(--pink);animation:ring 1s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}

/* ---------- story ---------- */
.story{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,18px);min-height:0}
.spage{position:relative;width:min(100%,900px,calc((100vh - 312px) * 16 / 9));aspect-ratio:16/9;border-radius:34px;overflow:hidden;box-shadow:var(--lift);background:var(--paper)}
.spage img{width:100%;height:100%;object-fit:cover;display:block}
.spage.turn-in img{animation:pagein .6s cubic-bezier(.2,1.2,.4,1) both}
@keyframes pagein{from{transform:translateX(12%) rotate(2deg);opacity:0}to{transform:none;opacity:1}}
.stext{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.6vmin,46px);text-align:center;line-height:1.2;max-width:900px;text-wrap:balance;min-height:2.4em}
.stext .der,.stext .den{color:var(--der)} .stext .die{color:var(--die)} .stext .das{color:var(--das-ink)}
.stext .wd{display:inline-block;transition:transform .2s}
.stext .wd.hi{transform:translateY(-6px) scale(1.08)}
.snav{display:flex;gap:clamp(18px,4vw,36px);align-items:center;margin-top:8px}
.squiz{display:flex;gap:clamp(14px,3vw,28px);justify-content:center;margin-top:10px}
#story.rebus .stext{display:none}
#story.rebus .spage{width:min(100%,900px,calc((100vh - 360px) * 16 / 9))}
.squiz.rebus{flex-wrap:wrap;align-items:center;gap:clamp(8px,1.6vh,16px) clamp(16px,3vw,36px);margin-top:0;max-width:100%}

.sq{width:clamp(96px,15vmin,130px);aspect-ratio:1;border-radius:26px;background:var(--paper);box-shadow:var(--lift);overflow:hidden;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transition:transform .15s,opacity .25s}

/* ---------- garden: floating clay island that tilts in 3D ---------- */
.garden{position:relative;flex:1;min-height:0;border-radius:36px;overflow:hidden;box-shadow:var(--lift);
  background:linear-gradient(180deg,#D9CDF2 0%,#EBCBE8 45%,#F8C9DA 100%);display:grid;place-items:center;perspective:1100px;touch-action:none}
.island{position:relative;width:min(100%,calc((100vh - 130px) * 4 / 3));aspect-ratio:4/3;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
.island.drag{transition:none}
.island .floaty{position:absolute;inset:0;transform-style:preserve-3d;animation:hover 6s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6%)}}
.island .base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  -webkit-mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 72% 70% at 50% 50%,#000 70%,transparent 100%)}
.gi,.ghouse{position:absolute;transform:translate(-50%,-100%) translateZ(var(--z,24px));transform-style:preserve-3d;background:none;padding:0}
.gi img,.ghouse img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 5px rgba(60,30,40,.25))}
.gi.new{animation:drop 1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translate(-50%,-260%) translateZ(var(--z,24px)) scale(.4);opacity:0}60%{opacity:1}to{transform:translate(-50%,-100%) translateZ(var(--z,24px)) scale(1)}}
.gi.fly img{animation:flutter 3.2s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(-6deg)}50%{transform:translate(18px,-16px) rotate(8deg)}}
.gi.sway img{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.sprout{position:absolute;transform:translate(-50%,-100%) translateZ(20px);font-size:clamp(22px,4vmin,38px);line-height:1;animation:wiggle 1.4s ease-in-out infinite}
.ghouse .orb{width:100%;animation:bounce 2.2s ease-in-out infinite}
.ghouse .orb::after{display:none}
.gi,.ghouse,.kid{--sx:1}
.gi img,.kid img{scale:var(--sx) 1}   /* separate from transform, so the sway and flutter animations keep working */
.garden.design .island{transform:none!important;transition:none}
.garden.design .island .floaty{animation:none}
.garden.design .gi,.garden.design .ghouse,.garden.design .kid{cursor:grab;outline:3px dashed rgba(255,255,255,.75);outline-offset:4px;border-radius:14px;touch-action:none}
.garden.design .moving{cursor:grabbing;outline-color:var(--star);filter:drop-shadow(0 14px 10px rgba(60,30,40,.35))}
.garden.design .sprout,.garden.design .mote{display:none}
.gedit.on{background:var(--star);color:#3B2352}
.ghint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:800;font-size:clamp(15px,2.6vmin,20px);padding:8px 18px;border-radius:999px;box-shadow:var(--lift);white-space:nowrap;pointer-events:none}
#gardenScreen{position:relative}
.ghouse .gshadow{display:block;width:80%;height:14px;margin:-6px auto 0;border-radius:50%;background:rgba(60,30,60,.25);filter:blur(3px);animation:squash 2.2s ease-in-out infinite}
.ghouse[data-a="die"] .orb,.ghouse[data-a="die"] .gshadow{animation-delay:-.7s} .ghouse[data-a="das"] .orb,.ghouse[data-a="das"] .gshadow{animation-delay:-1.4s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-22%)}}
@keyframes squash{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.6);opacity:.5}}
.mote{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.7;pointer-events:none;animation:mote 7s linear infinite}
@keyframes mote{from{transform:translateY(0);opacity:0}20%{opacity:.8}to{transform:translateY(-160px);opacity:0}}

/* ---------- the world: her garden and the sticker islands, full screen on the iPad ---------- */
#gardenScreen{position:fixed;inset:0;z-index:2;max-width:none;margin:0;padding:0;gap:0;overflow:hidden}

/* full screen, the picture's own edges fade into the sky behind it */
#gardenScreen .island .base{-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 92%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 92%,transparent);mask-composite:intersect}
#gardenScreen .island.arrive{animation:w-arrive .7s cubic-bezier(.25,1.3,.45,1) both}

.wbar{position:absolute;z-index:6;top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));

.wend{display:flex;gap:12px}
#nightBtn.on{background:#2B2560;color:#FFE27A}

.islands{position:absolute;z-index:6;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
.inav{position:relative;width:clamp(58px,8.5vmin,76px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);

  font-size:17px;display:grid;place-items:center;box-shadow:0 0 0 3px #fff;animation:pulse 1.2s ease-in-out infinite}

  font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:6px;box-shadow:var(--lift);animation:pop .3s both;pointer-events:none}

/* her stickers on an island: puffy die-cut stickers that stand in the 3D world */
.stk{position:absolute;width:12.5%;padding:0;background:none;transform-origin:50% 100%;touch-action:none;
  transform:translate(-50%,-100%) translateZ(var(--z,24px)) scale(var(--d,1));transform-style:preserve-3d}

.mv-breathe{animation:w-breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}

@keyframes fly{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(6%,-14%) rotate(5deg)}}

.wchip{position:absolute;left:50%;bottom:104%;translate:-50% 0;white-space:nowrap;background:#fff;color:#3B2352;border-radius:999px;padding:4px 14px;

  transform:translate(-50%,-100%) translateZ(var(--z,24px)) scale(var(--d,1));transform-style:preserve-3d}

.visit::after{content:"";position:absolute;left:8%;right:8%;bottom:-2%;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(50,25,60,.32),transparent);pointer-events:none}

@keyframes v-in-l{0%{translate:-320% -30%;opacity:0;rotate:-8deg}20%{opacity:1}30%{translate:-210% 0;rotate:6deg}45%{translate:-150% -14%;rotate:-6deg}
  60%{translate:-80% 0;rotate:6deg}75%{translate:-30% -10%;rotate:-4deg}88%{translate:0 0;rotate:0deg}94%{translate:0 -4%}100%{translate:0 0;opacity:1;rotate:0deg}}
@keyframes v-in-r{0%{translate:320% -30%;opacity:0;rotate:8deg}20%{opacity:1}30%{translate:210% 0;rotate:-6deg}45%{translate:150% -14%;rotate:6deg}
  60%{translate:80% 0;rotate:-6deg}75%{translate:30% -10%;rotate:4deg}88%{translate:0 0;rotate:0deg}94%{translate:0 -4%}100%{translate:0 0;opacity:1;rotate:0deg}}

@keyframes v-out-l{0%{translate:0 0}25%{translate:-60% -14%;rotate:-6deg}50%{translate:-130% 0;rotate:6deg;opacity:1}75%{translate:-200% -14%;rotate:-6deg}100%{translate:-300% 0;opacity:0}}
@keyframes v-out-r{0%{translate:0 0}25%{translate:60% -14%;rotate:6deg}50%{translate:130% 0;rotate:-6deg;opacity:1}75%{translate:200% -14%;rotate:6deg}100%{translate:300% 0;opacity:0}}

.vwant{position:absolute;left:50%;bottom:112%;width:160%;aspect-ratio:1;translate:-50% 0;border-radius:50%;background:#fff;
  box-shadow:0 8px 20px rgba(92,38,130,.22);display:grid;place-items:center;opacity:0;scale:.2;transform-origin:50% 100%;

/* day and night */

/* ---------- Mila's tree ---------- */
#milaScreen{position:fixed;inset:0;z-index:2;max-width:none;margin:0;padding:0;gap:0;overflow:hidden;background:#BFE3F7}
.mtree-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

.mtbg{position:absolute;inset:0;width:100%;height:100%;-webkit-user-drag:none;-webkit-touch-callout:none;pointer-events:none}
.tmila{position:absolute;padding:0;background:none;border:0;translate:-50% 0;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.tmila img{display:block;width:100%;-webkit-user-drag:none;-webkit-touch-callout:none;filter:drop-shadow(0 10px 10px rgba(40,60,30,.25))}

@keyframes mbreathe{0%,100%{transform:none}50%{transform:scale(1.03,.97)}}
@keyframes msway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* while Mila waits for a leaf, a speech bubble next to her: tap it (or her) to hear the word again */
.tsay{position:absolute;left:62%;bottom:88%;width:clamp(46px,34%,70px);aspect-ratio:1;border-radius:50%;background:#fff;color:var(--grape);
  display:grid;place-items:center;box-shadow:0 8px 18px rgba(92,38,130,.22);opacity:0;scale:.3;transform-origin:0 100%;

@keyframes maway{0%{transform:none;opacity:1}30%{transform:translate(40%,-60%) rotate(8deg)}60%{transform:translate(-30%,-140%) rotate(-10deg) scale(.8)}100%{transform:translate(120%,-320%) rotate(12deg) scale(.4);opacity:0}}
.tmila.egg img{animation:mwobble 1.6s ease-in-out infinite;transform-origin:50% 100%}
.tmila.egg.hatch img{animation:mwobble .25s ease-in-out infinite}
@keyframes mwobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
#tFlock{position:absolute;inset:0;pointer-events:none;z-index:1}

.tleaf{position:absolute;width:clamp(70px,6.6%,112px);translate:-50% -50%;padding:0;background:none;border:0;touch-action:none;z-index:2}

const $ = (id) => document.getElementById(id);

const pad = (n) => String(n).padStart(2, "0");

const today = () => fmt(new Date());
const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return fmt(new Date(y, m - 1, d + n)); };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const norm = (s) => String(s).trim().toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9-]/g,"");

document.addEventListener("error", (e) => {
  const img = e.target;
  if (!img || img.tagName !== "IMG") return;
  failedPics.add(img.getAttribute("src"));
  if (img.dataset.yay) { img.closest(".tile").outerHTML = '<span class="fallback">✌️</span>'; return; }
  if (img.dataset.star) { $("starImg").hidden = true; $("bigStar").hidden = false; return; }
  if (img.dataset.friend) { img.remove(); return; }
  if (img.dataset.garden) { img.replaceWith(document.createTextNode("🌼")); return; }
  if (img.dataset.sticker) { img.replaceWith(document.createTextNode("⭐")); return; }
  const holder = img.closest(".tile, .card-pic");
  if (!holder) return;
  if (holder.id === "cardPic") { holder.hidden = true; $("emoji").hidden = false; return; }
  if (holder.id === "qPic") { holder.hidden = true; $("qEmoji").hidden = false; return; }
  holder.replaceWith(document.createTextNode(img.dataset.fallback || ""));
}, true);

function blankProgress() { return { words: {}, stars: 0, sessions: 0, lastPlayed: null, points: 0, pointsUsed: 0, stickers: [], roundsSinceQuiz: 0, quizzes: 0, days: [], gardenSeen: 0, storySeen: "", log: {}, starred: null, letters: {} }; }
function normalizeProgress(p) {
  const out = blankProgress();
  if (p && typeof p === "object") {
    for (const k of ["stars", "sessions", "points", "pointsUsed", "roundsSinceQuiz", "quizzes", "gardenSeen", "sentNext", "fed", "leaves"]) out[k] = Number(p[k]) || 0;
    if (Array.isArray(p.days)) out.days = p.days.filter(d => typeof d === "string").slice(-120);
    out.storySeen = typeof p.storySeen === "string" ? p.storySeen : "";
    out.storiesSeen = Array.isArray(p.storiesSeen) ? p.storiesSeen.filter(x => typeof x === "string") : (out.storySeen ? [out.storySeen] : []);
    if (p.log && typeof p.log === "object") out.log = clone(p.log);
    out.lastPlayed = p.lastPlayed || null;
    if (p.words && typeof p.words === "object") out.words = clone(p.words);
    if (p.letters && typeof p.letters === "object") out.letters = clone(p.letters);
    if (Array.isArray(p.stickers)) out.stickers = p.stickers.filter(s => typeof s === "string");
    out.nextStk = typeof p.nextStk === "string" ? p.nextStk : "";
    out.missionSeen = typeof p.missionSeen === "string" ? p.missionSeen : "";
    if (p.gardenPos && typeof p.gardenPos === "object") out.gardenPos = clone(p.gardenPos);
    if (p.world && typeof p.world === "object") out.world = clone(p.world);
    if (Array.isArray(p.trayed)) out.trayed = p.trayed.filter(x => typeof x === "string");
    if (Array.isArray(p.islandsSeen)) out.islandsSeen = p.islandsSeen.filter(x => typeof x === "string");
    if (Array.isArray(p.ate)) out.ate = p.ate.filter(x => typeof x === "string");

// A word the school accepts with two articles (der/das Iglu) lists the second one in alt: both count as right.
const artOK = (w, a) => a === w.article || (w.alt || []).includes(a);
function normalizeWords(list) {
  const seen = new Set(), out = [];
  for (const w of Array.isArray(list) ? list : []) {
    if (!w || !ARTS.includes(String(w.article).toLowerCase()) || !String(w.noun || "").trim()) continue;
    const noun = capNoun(w.noun), id = w.id ? String(w.id) : norm(noun);
    if (!id || seen.has(id)) continue;
    seen.add(id);
    out.push({ id, noun, article: String(w.article).toLowerCase(), emoji: String(w.emoji || ""), ...(w.pic ? { pic: String(w.pic) } : {}), ...(w.s ? { s: String(w.s) } : {}), ...(w.rec ? { rec: true } : {}), ...(Array.isArray(w.alt) && w.alt.length ? { alt: w.alt.filter(a => ARTS.includes(a)) } : {}) });
  }
  return out;
}
// Which wrong circle she tapped for a word, so the grown-ups can see what gets mixed up.
function noteMiss(w, picked) {
  if (!w || !ARTS.includes(picked) || artOK(w, picked)) return;
  const mix = { ...(prog(w.id).mix || {}) };
  mix[picked] = (mix[picked] || 0) + 1;
  setProg(w.id, { mix, missed: today() });
}
const mixText = (p) => ARTS.filter(a => p.mix && p.mix[a]).sort((a, b) => p.mix[b] - p.mix[a]).map(a => "“" + a + "” " + p.mix[a] + "×").join(", ");
const prog = (id) => state.progress.words[id] || { box: 0, due: null, seen: 0, wrong: 0 };
const setProg = (id, patch) => { state.progress.words[id] = { ...prog(id), ...patch }; };
// First-try answers (practice and quiz) needed for each new sticker.
const perSticker = () => Math.max(3, Number(state.settings.perSticker) || 30);
function fixPace() { if (state.settings.stkPace !== 2) { if (!(Number(state.settings.perSticker) > 10)) state.settings.perSticker = 30; state.settings.stkPace = 2; } }
function syncLearn() { const n = Number(state.settings.learnAfter); MASTERED = [3, 4, 5].includes(n) ? n : 3; }
const learned = (w) => (prog(w.id).box || 0) >= MASTERED;
// a word she knows only comes back when its check is due; every other word keeps coming until she knows it
const needsWork = (w) => { const p = prog(w.id); return (p.box || 0) < MASTERED || !p.due || p.due <= today(); };
// The first answer to a word in a round: right moves it one step up, wrong starts it over. done (a Set) keeps a
// game from counting the same word twice in one round.
function scoreWord(id, ok, done) {
  if (!id || (done && done.has(id))) return;
  if (done) done.add(id);
  const p = prog(id), patch = { seen: (p.seen || 0) + 1 };
  if (ok) {
    patch.box = Math.min(MASTERED + REVIEW_DAYS.length - 1, (p.box || 0) + 1);
    patch.due = patch.box < MASTERED ? today() : addDays(today(), REVIEW_DAYS[patch.box - MASTERED]);
  } else { patch.box = 0; patch.due = today(); patch.wrong = (p.wrong || 0) + 1; }
  setProg(id, patch);
}
const quizDue = () => state.words.length >= 3 && state.progress.roundsSinceQuiz >= (Number(state.settings.quizEvery) || 2);
function needsPractice(w) {
  const p = prog(w.id), q = p.q;
  if (q && q.ok === false) return "missed in the last quiz";
  if (q && q.w > 0 && q.w >= q.r) return "often missed in quizzes";
  if ((p.wrong || 0) >= 2 && (p.box || 0) < 2) return "often missed in practice";
  const mix = p.mix || {}, top = ARTS.filter(a => mix[a]).sort((a, b) => mix[b] - mix[a])[0];
  if (top && mix[top] >= 2 && (p.box || 0) < MASTERED) return "often picks “" + top + "”";
  return "";
}

/* ---------- local fallback storage ---------- */
function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function lsSet() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ words: state.words, bank: state.bank, settings: state.settings, sample: state.sample, progress: state.progress })); } catch {}
}
function loadLocal() {
  const d = lsGet();
  if (d) {
    state.words = normalizeWords(d.words); state.bank = normalizeWords(d.bank); state.sample = !!d.sample;
    state.settings = { ...state.settings, ...(d.settings || {}) }; fixPace(); syncLearn();
    state.progress = normalizeProgress(d.progress);
  } else {
    state.words = normalizeWords(SAMPLE); state.sample = true;
  }
  state.wordsLoaded = true;
}

/* ---------- saving (one write at a time per document) ---------- */
let progSaving = false, progDirty = false;
async function saveProgress() {
  if (state.mode !== "online") { lsSet(); return; }
  if (progSaving) { progDirty = true; return; }
  progSaving = true;
  try { await state.db.doc("progress/main").set(clone(state.progress)); }
  catch (e) { console.warn("progress save failed", e); }
  progSaving = false;
  if (progDirty) { progDirty = false; saveProgress(); }
}
let wordsChain = Promise.resolve();
function saveWords() {
  if (state.mode !== "online") { lsSet(); return Promise.resolve(true); }
  const body = { words: clone(state.words), bank: clone(state.bank), settings: clone(state.settings), sample: state.sample, updated: today() };
  wordsChain = wordsChain.then(() => state.db.doc("lists/current").set(body).then(() => true, (e) => { console.warn(e); return false; }));
  return wordsChain;
}

      o.connect(g).connect(c.destination); o.start(t); o.stop(t + len + 0.02);

// Words leaving this week's list move to the bank, so they keep coming back for review.

}
// Older words for this round: the ones she struggled with always come back; words she knows only when due.
function reviewWords(max) {
  const t = today();
  const weakness = (w) => { const p = prog(w.id), q = p.q || {}; return (needsPractice(w) ? 100 : 0) + (q.w || 0) * 5 + (p.wrong || 0) * 2 - (p.box || 0) * 3; };
  const cand = state.bank.filter(w => needsPractice(w) || (prog(w.id).box || 0) < MASTERED || !prog(w.id).due || prog(w.id).due <= t);
  return shuffle(cand).sort((a, b) => weakness(b) - weakness(a)).slice(0, max);
}
const allWords = () => [...state.words, ...state.bank];
// Every game: this week's words she hasn't learned yet (the tricky ones always come along), plus the older words she

  const nOld = Math.min(old.length, Math.max(older, n - work.length));

  return shuffle(pick);

    const words = shuffle([...only, ...extra]).slice(0, 12);

/* ---------- colour warm-up before practice: hear der/die/das, tap the colour ---------- */
const WARM_TAPS = 6;

  let seq; do { seq = shuffle([...ARTS, ...ARTS]); } while (seq.some((a, i) => a === seq[i - 1]));   // no colour twice in a row
  WU = { seq: seq.slice(0, WARM_TAPS), i: 0, miss: false, locked: true, marks: [] };

}

// Drag (or tilt the iPad) to turn the island a little in 3D; it springs back when let go.

const MEM_PAIRS = 8;
function startMemory() {
  const pool = mixWords(Math.max(12, state.words.length), 4);
  const by = {}; for (const a of ARTS) by[a] = shuffle(pool.filter(w => w.article === a));
  // up to 8 pairs (16 cards); each article gets pairs in proportion to its words, at least one if it has any
  const want = Math.min(MEM_PAIRS, Math.max(3, state.words.length));
  const plan = {}; for (const a of ARTS) plan[a] = by[a].length ? Math.max(1, Math.floor(by[a].length / 2)) : 0;
  const total = () => ARTS.reduce((n, a) => n + plan[a], 0);
  while (total() > want) { const a = ARTS.reduce((x, y) => plan[y] > plan[x] ? y : x); plan[a]--; }
  for (let guard = 0; total() < want && guard < 20; guard++) {
    const a = ARTS.filter(x => by[x].length).reduce((x, y) => by[y].length / (plan[y] + 1) > by[x].length / (plan[x] + 1) ? y : x, ARTS.find(x => by[x].length));
    if (!a) break; plan[a]++;
  }
  let cards = [];
  for (const a of ARTS) for (let i = 0; i < plan[a] * 2; i++) cards.push(by[a][i % by[a].length]);
  if (cards.length < 6) return;
  cards = shuffle(cards);
  M = { cards, open: [], matched: new Set(), pairs: cards.length / 2, found: 0, earned: 0, lock: false };
  const cols = cards.length > 8 ? 4 : 3, rows = Math.ceil(cards.length / cols);

  $("mgrid").style.width = "min(100%, 760px, calc((100vh - 170px) * " + (cols / rows).toFixed(2) + "))";   // all rows fit on screen
  $("mgrid").innerHTML = cards.map((w, i) => '<button class="mcard deal ' + w.article + '" data-i="' + i + '" style="animation-delay:' + (i * 0.05) + 's"><span class="in"><span class="f back">★</span><span class="f front">' + faceHTML(w) + "</span></span></button>").join("");
  renderMDots();
  renderStars();
  show("memory");
  say([C("f-paare")]);
}

function renderBDots() {
