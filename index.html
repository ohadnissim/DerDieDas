/* ---------- two circle games ---------- */
// max:  Max says a word with an article – sometimes the wrong one. Thumbs up or down; if he got it wrong she shows him the right circle.
// hear: she sees the picture and Mila says only the word (no article). She picks the circle, then hears it with its article.
const tricky = (w) => { const p = prog(w.id); return (needsPractice(w) ? 5 : 0) + ARTS.reduce((n, a) => n + ((p.mix || {})[a] || 0), 0); };
function gameWords(mode) {
  let ws = mode === "max" ? allWords().filter(w => MAX_CLAIMS[w.id] && MAX_CLAIMS[w.id][0] === w.article && norm(w.noun) === w.id) : state.words;
  if (mode !== "max") { const rec = ws.filter(w => N(w).key); if (rec.length >= 3) ws = rec; }
  // a couple of her tricky words always come along, the rest at random
  const byTrick = shuffle(ws).sort((a, b) => tricky(b) - tricky(a));
  return shuffle([...byTrick.slice(0, 2), ...shuffle(byTrick.slice(2)).slice(0, 4)]);
}
const gPicEl = () => $("gPic").hidden ? $("gEmoji") : $("gPic");
const gOrb = (a) => document.querySelector('#gChoices .choice[data-a="' + a + '"]');
function gOrbsReset(disabled) { document.querySelectorAll("#gChoices .choice").forEach(b => { b.disabled = !!disabled; b.className = "choice orb " + b.dataset.a; }); }
function startCircleGame(mode) {
  const words = gameWords(mode);
  if (words.length < 3) return;
  G = { mode, words, i: 0, earned: 0, res: {}, phase: "intro", claim: "" };
  $("gMax").hidden = true; $("gThumbs").hidden = true;
  $("gPic").hidden = true; $("gEmoji").hidden = false; $("gEmoji").className = "emoji";
  $("gEmoji").textContent = mode === "max" ? "" : "👂";
  $("gCaption").className = "caption"; $("gCaption").innerHTML = "";
  $("gcard").className = "card";
  gOrbsReset(true); $("gChoices").hidden = mode === "max";
  renderStars(); renderGDots(); show("cgame");
  const my = G;
  const intro = async () => {
    await sleep(300);
    if (mode === "max") { if (G === my) { $("gMax").hidden = false; restart($("gMax"), "enter"); } return say([C("f-maxsagt")]); }
    return say([C("f-hoerspiel")]);
  };
  intro().then(() => { if (G === my) nextG(); });
}
function renderGDots() { $("gdots").innerHTML = G.words.map((w, i) => '<span class="dot ' + (w.id in G.res ? (G.res[w.id] ? "ok" : "miss") : "") + (i === G.i ? " now" : "") + '"></span>').join(""); }
function gPrompt() {
  const w = G && G.words[G.i]; if (!w) return;
  if (G.mode === "max") return say([maxSays(w, G.claim), C("f-stimmt")]);
  return say([N(w)]);
}
function nextG() {
  if (G.i >= G.words.length) return finishG();
  const w = G.words[G.i], my = G;
  G.phase = "listen";
  $("gCaption").className = "caption"; $("gCaption").innerHTML = "";
  $("gcard").className = "card"; restart($("gcard"), "enter");
  $("gThumbs").hidden = true;
  gOrbsReset(true);
  renderGDots();
  if (G.mode === "max") {
    setPicture($("gPic"), $("gEmoji"), w);
    G.claim = Math.random() < 0.5 ? w.article : MAX_CLAIMS[w.id][1];
    $("gChoices").hidden = true;
    $("gBubble").className = "bubble " + G.claim; $("gBubble").textContent = G.claim + " " + w.noun + "!";
    $("gMax").hidden = false; restart($("gMax"), "talk");
    gPrompt().then(() => { if (G === my && G.words[G.i] === w && G.phase === "listen") { G.phase = "judge"; $("gThumbs").hidden = false; restart($("gThumbs"), "enter"); } });
  } else {
    setPicture($("gPic"), $("gEmoji"), w);
    $("gChoices").hidden = false; restart($("gChoices"), "enter");
    gPrompt().then(() => { if (G === my && G.words[G.i] === w && G.phase === "listen") { G.phase = "pick"; gOrbsReset(false); } });
  }
}
function gReveal(w, ok) {
  setPicture($("gPic"), $("gEmoji"), w);
  $("gcard").className = "card " + w.article;
  $("gCaption").innerHTML = '<span class="art ' + w.article + '">' + w.article + "</span> " + esc(w.noun);
  $("gCaption").className = "caption show";
  G.res[w.id] = ok;
  if (ok) { G.earned++; addStars(); }
  renderGDots();
}
function gNext(spoken) { const my = G; spoken.then(() => sleep(900)).then(() => { if (G === my) { G.i++; nextG(); } }); }
function gPick(btn) {
  if (!G || (G.phase !== "pick" && G.phase !== "fix")) return;
  const w = G.words[G.i], a = btn.dataset.a, fix = G.phase === "fix";
  G.phase = "";
  document.querySelectorAll("#gChoices .choice").forEach(b => b.disabled = true);
  if (artOK(w, a)) {
    chime(); btn.classList.add("right"); cheer(a, btn); sparkle(btn, 10); gReveal(w, true);
    if (fix) { restart($("gMax"), "talk"); gNext(say([C("k-max-danke"), W(w)])); }
    else gNext(say([C(pick(PRAISE)), W(w)]));
  } else {
    noteMiss(w, a); gReveal(w, false);
    const rb = gOrb(w.article), fixed = oops(btn, rb, w, { pic: gPicEl() });
    if (fix) gNext(fixed.then(() => { restart($("gMax"), "talk"); return say([C("k-max-danke")]); }));
    else gNext(fixed);
  }
}
function gJudge(yes) {
  if (!G || G.phase !== "judge") return;
  const w = G.words[G.i], right = artOK(w, G.claim);
  $("gThumbs").hidden = true;
  if (yes && right) { G.phase = ""; chime(); cheer(w.article, $("gcard")); gReveal(w, true); gNext(say([C("k-max-c1"), W(w)])); }
  else if (!yes && !right) {
    // she caught Max's mistake: now she shows him the right circle
    G.phase = "fix"; chime(); sparkle($("gBubble"), 10);
    gOrbsReset(false); const cb = gOrb(G.claim); cb.disabled = true; cb.classList.add("wrong");
    $("gChoices").hidden = false; restart($("gChoices"), "enter");
    say([C("f-nein"), C("f-welche")]);
  } else {
    // she agreed with Max's mistake, or said "no" when he was right: show the right circle and she taps it
    G.phase = ""; if (yes) noteMiss(w, G.claim); gReveal(w, false);
    gOrbsReset(true); $("gChoices").hidden = false; restart($("gChoices"), "enter");
    gNext(oops(yes ? gOrb(G.claim) : null, gOrb(w.article), w, { pic: gPicEl() }));
  }
}
document.querySelectorAll("#gChoices .choice").forEach(b => b.addEventListener("click", () => gPick(b)));
$("gYes").addEventListener("click", () => gJudge(true));
$("gNo").addEventListener("click", () => gJudge(false));
$("gListen").addEventListener("click", () => {
  if (!G) return;
  const w = G.words[G.i]; if (!w) return;
  if (G.phase === "fix") say([C("f-welche")]); else if (G.phase === "") say([W(w)]); else gPrompt();
});
function finishG() {
  const rows = G.words.map(w => ({ w, mark: G.res[w.id] ? "ok" : "miss" }));
  const earned = G.earned, grew = markDay(); logDay("g");
  lastActivity = G.mode; G = null;
  state.progress.lastPlayed = today(); saveProgress();
  showDone(earned, rows, stickersNow(), quizDue(), grew);
}
$("maxBtn").addEventListener("click", () => { pop(); startCircleGame("max"); });
$("hearBtn").addEventListener("click", () => { pop(); startCircleGame("hear"); });

/* ---------- printable word cards (grown-ups) ---------- */
// The iPad app can't print, so there the button opens this page in Safari, which prints straight away.
const PRINT_URL = "https://ohadnissim.github.io/DerDieDas/";
const inApp = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function openPrint(pairs) {
  if (inApp()) { window.open(PRINT_URL + "#print" + (pairs ? "-pairs" : ""), "_blank"); return; }
  const words = state.words.length ? state.words : allWords();
  const cards = (pairs ? words.flatMap(w => [w, w]) : words).map(w => {
    const src = picSrc(w);
    return '<div class="pcard"><div class="pin ' + w.article + '">' +
      (src ? '<img src="' + esc(src) + '" alt="">' : '<span class="pemo">' + esc(w.emoji || "") + "</span>") +
      '<span class="pword ' + w.article + '"><i></i>' + w.article + " " + esc(w.noun) + "</span></div></div>";
  }).join("");
  $("printSheet").innerHTML = '<div class="ptools"><button class="btn primary" id="pGo">Print</button><button class="btn" id="pClose">Close</button>' +
    '<span class="small">' + words.length + " words" + (pairs ? " · 2 of each for Memory" : "") + '. If nothing happens, use Share → Print.</span></div><div class="pcards">' + cards + "</div>";
  $("printSheet").hidden = false;
  $("pGo").addEventListener("click", () => { try { window.print(); } catch {} });
  $("pClose").addEventListener("click", () => { $("printSheet").hidden = true; });
  if (grownOpen) $("grown").hidden = true;
  const imgs = [...$("printSheet").querySelectorAll("img")];
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => sleep(200)).then(() => { try { window.print(); } catch {} });
}
$("printSheet").addEventListener("click", (e) => { if (e.target.id === "pClose") { if (grownOpen) $("grown").hidden = false; } });

/* ---------- story of the week ---------- */
// Articles are coloured, and kept on the same line as their noun ("die" never waits alone at the end of a line).
function colourText(t) {
  const toks = esc(t).split(/(\s+)/), out = [];
  for (let i = 0; i < toks.length; i++) {
    const tok = toks[i], a = tok.toLowerCase().replace(/[^a-zäöüß]/g, "");
    if (!ARTS.includes(a) && a !== "den") { out.push(tok); continue; }
    const art = '<span class="wd ' + a + '">' + tok + "</span>";
    if (i + 2 < toks.length && /^\s+$/.test(toks[i + 1])) { out.push('<span class="nb">' + art + " " + toks[i + 2] + "</span>"); i += 2; }
    else out.push(art);
  }
  return out.join("");
}
// Two or more stories: a shelf with a cover card for each (newest first, "Neu!" until she has finished it).
const storyDone = (st) => (state.progress.storiesSeen || []).includes(st.id) || state.progress.storySeen === st.id;
let lastStoryId = "";
function openStories() {
  if (state.stories.length <= 1) return startStory(state.stories[0]);
  for (const st of state.stories) if (st.sprite) loadClip(st.sprite.file, true);
  $("shelfList").innerHTML = state.stories.slice().reverse().map(st =>
    '<button class="scard" data-id="' + esc(st.id) + '"><img src="' + esc(st.cover || st.pages[0].img) + '" alt="">' +
    '<span class="stitle">' + colourText(st.title || "") + "</span>" + (storyDone(st) ? "" : '<span class="snew">Neu!</span>') + "</button>").join("");
  renderStars(); show("shelf");
  say([C("f-welchegeschichte")]);
}
$("shelfList").addEventListener("click", (e) => {
  const b = e.target.closest(".scard"); if (!b) return;
  const st = state.stories.find(x => x.id === b.dataset.id); if (!st) return;
  pop(); bump(b); sparkle(b, 10);
  const go = () => { if (!$("shelf").hidden) startStory(st); };
  if (st.titleAudio) say([{ key: st.titleAudio, text: st.title }]).then(go); else go();
});
function startStory(pick) {
  const st = pick || state.stories[state.stories.length - 1];
  if (!st) return;
  lastStoryId = st.id;
  // The "!" on the story button means "a story she hasn't opened yet": opening it is enough, she doesn't have to finish it.
  if (!storyDone(st)) { (state.progress.storiesSeen || (state.progress.storiesSeen = [])).push(st.id); state.progress.storySeen = st.id; saveProgress(); }
  if (st.sprite) loadClip(st.sprite.file, true);
  ST = { st, i: 0, done: {}, step: null };
  renderStars(); show("story"); showPage();
}
// A page: Mila reads, then the kids say their own lines, then (sometimes) something to do:
//   satz – fill the circles of the page's picture sentence, find – tap the thing in the picture, ask – a kid asks her "der, die oder das?", q – pick the right picture.
const pageLines = (pg) => pg.lines || (pg.kid ? [pg.kid] : []);
const STEPS = ["satz", "find", "ask", "q"];
function showPage() {
  const pg = ST.st.pages[ST.i];
  $("sdots").innerHTML = ST.st.pages.map((_, i) => '<span class="dot' + (i < ST.i ? " ok" : "") + (i === ST.i ? " now" : "") + '"></span>').join("");
  $("spage").innerHTML = '<img src="' + esc(pg.img) + '" alt="">';
  restart($("spage"), "turn-in");
  $("stext").classList.remove("finding");
  $("stext").innerHTML = '<span class="snarr">' + colourText(pg.text) + "</span>" +
    (pageLines(pg).length ? '<span class="slines">' + pageLines(pg).map((l, k) => '<span class="skid" data-k="' + k + '"><b>' + esc(KID_NAMES[l.who] || "") + ":</b> " + colourText(l.text) + "</span>").join("") + "</span>" : "");
  $("sPrev").disabled = ST.i === 0;
  ST.step = null;
  $("squiz").hidden = true; $("snav").hidden = false;
  const my = ST, idx = ST.i, here = () => ST === my && ST.i === idx;
  readPage().then(async () => {
    for (const s of STEPS) {
      if (!here()) return;
      if (!pg[s] || ST.done[idx + s]) continue;
      await runStep(s, pg[s]);
      if (!here()) return;
      ST.done[idx + s] = true;
      await sleep(350);
    }
  });
}
function readPage() {
  const pg = ST.st.pages[ST.i], my = ST, idx = ST.i, here = () => ST === my && ST.i === idx;
  const words = [...$("stext").querySelectorAll(".snarr .wd")];
  words.forEach((el, k) => setTimeout(() => { if (here()) { el.classList.add("hi"); setTimeout(() => el.classList.remove("hi"), 500); } }, 300 + k * 900));
  return say([{ key: pg.audio, text: pg.text }], 0.8).then(async () => {
    const lines = pageLines(pg);
    for (let k = 0; k < lines.length; k++) {
      await sleep(250); if (!here()) return;
      const el = $("stext").querySelector('.skid[data-k="' + k + '"]');
      if (el) el.classList.add("on");
      kidPop(lines[k].who);
      await say([{ key: lines[k].audio, text: lines[k].text }]);
      if (el) el.classList.remove("on");
      if (!here()) return;
    }
  });
}
// Each step shows its own controls instead of the arrows and resolves when she is done.
function runStep(type, data) {
  return new Promise((resolve) => {
    ST.step = { type, data, resolve, tries: 0 };
    $("snav").hidden = true;
    if (type === "satz") startSatz(data); else if (type === "find") startFind(data); else if (type === "ask") startAsk(data); else askStory(data);
  });
}
function endStep(delay = 400) {
  const my = ST, step = ST && ST.step;
  if (!step) return;
  step.type = "";                                   // no more taps count
  sleep(delay).then(() => {
    if (ST !== my || ST.step !== step) return;
    ST.step = null;
    $("squiz").hidden = true; $("story").classList.remove("rebus"); $("snav").hidden = false; bump($("sNext"));
    step.resolve();
  });
}
function stepPrompt() {
  const s = ST && ST.step; if (!s) return;
  if (s.type === "find") say([{ key: s.data.audio, text: s.data.text }]);
  else if (s.type === "ask") say([C("f-welche")]);
  else if (s.type === "q") say([{ key: s.data.audio, text: s.data.text }]);
  else if (s.type === "satz") say([(s.f[0] ? s.t.o : s.t.s).say]);
}

// satz: the page's sentence as a picture row like the school sheet. She fills the empty circles, then Mila reads it all.
const satzEl = (c) => $("squiz").querySelector(c);
function startSatz(d) {
  const t = makeSent(d.s, d.o);
  if (!t) { endStep(0); return; }
  const s = ST.step; s.t = t; s.f = [!t.s.art, false]; s.miss = false;
  if (SENT_T["ss-" + t.s.id + "-" + t.o.id]) loadClip("ssp-" + t.s.id);
  $("squiz").innerHTML = '<div class="trow srow"></div><div class="ttext stt"></div><div class="tpick spick"></div>';
  $("squiz").className = "squiz rebus"; $("squiz").hidden = false;
  $("story").classList.add("rebus");
  satzShow(); restart(satzEl(".srow"), "enter");
  const first = !ST.satzSaid; ST.satzSaid = true;
  say([C(first ? "f-satzmit" : "f-welchefarbe")]);
}
function satzShow() {
  const s = ST.step, obj = s.f[0];
  renderSentRow(satzEl(".srow"), satzEl(".stt"), s.t, s.f, true);
  satzEl(".spick").innerHTML = (obj ? ["den", "die", "das"] : ARTS).map(a => '<button class="choice orb ' + a + '" data-a="' + a + '"><span class="ow">' + (obj ? a : cap(a)) + "</span></button>").join("");
  restart(satzEl(".spick"), "enter");
}
async function satzTap(b) {
  const s = ST.step, my = ST, t = s.t, obj = s.f[0], part = obj ? t.o : t.s, a = b.dataset.a;
  if (b.disabled) return;
  if (a !== part.art) {
    // gentle, like the Sätze game: that circle drops out, the right one glows, Mila says the right words
    s.miss = true; b.disabled = true; b.classList.add("wrong");
    if (!obj && part.w) noteMiss(part.w, a);
    satzEl('.spick [data-a="' + part.art + '"]').classList.add("hint");
    say([C(pick(["f-upsi", "f-hoppla"])), part.say]);
    return;
  }
  s.type = "busy";
  chime(); b.classList.add("right"); sparkle(b, 10);
  if (!s.miss) addStars();
  s.f[obj ? 1 : 0] = true; s.miss = false;
  renderSentRow(satzEl(".srow"), satzEl(".stt"), t, s.f, false);
  satzEl(".spick").querySelectorAll(".choice").forEach(x => x.disabled = true);
  sparkle(satzEl('.srow [data-i="' + (obj ? 3 : 0) + '"]'), 12);
  const alive = () => ST === my && ST.step === s;
  const extra = part.art === "den" && !ST.denSaid ? [C("f-denregel")] : [];
  if (extra.length) ST.denSaid = true;
  await say([part.say, ...extra]); if (!alive()) return;
  if (!s.f[1]) { s.type = "satz"; satzShow(); return; }
  // both circles are full: Mila reads the whole sentence while each part lights up
  satzEl(".spick").innerHTML = "";
  await sleep(250); if (!alive()) return;
  await sayLit(t, satzEl(".srow"), satzEl(".stt"), alive, false); if (!alive()) return;
  sparkle(satzEl(".srow"), 20);
  await say([C(pick(PRAISE))]); if (!alive()) return;
  endStep(300);
}

// find: she taps the thing in the picture itself
function startFind(f) {
  $("spage").classList.add("finding");
  $("stext").classList.add("finding");
  $("stext").insertAdjacentHTML("beforeend", '<span class="sfind">👆 ' + colourText(f.text) + "</span>");
  say([{ key: f.audio, text: f.text }]);
}
function findTap(e) {
  const s = ST.step, f = s.data, img = $("spage").querySelector("img");
  const r = img.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
  const w = findWord(f.answer);
  const ring = document.createElement("span");
  ring.className = "fring"; ring.style.left = f.x + "%"; ring.style.top = f.y + "%"; ring.style.width = (f.r * 2) + "%";
  if (Math.hypot(x - f.x, (y - f.y) * 9 / 16) <= f.r * 1.15) {
    $("spage").classList.remove("finding");
    $("stext").classList.remove("finding"); $("stext").querySelector(".sfind")?.remove();
    $("spage").querySelectorAll(".fring").forEach(n => n.remove());
    ring.classList.add("got"); $("spage").appendChild(ring);
    chime(); sparkle(ring, 14); addStars();
    if (w) cheer(w.article, ring);
    s.type = "";
    say([C(pick(PRAISE)), w && W(w)]).then(() => endStep(300));
  } else {
    boop(); s.tries++;
    const miss = document.createElement("span");
    miss.className = "fmiss"; miss.style.left = x + "%"; miss.style.top = y + "%";
    $("spage").appendChild(miss); setTimeout(() => miss.remove(), 700);
    if (s.tries >= 2 && !$("spage").querySelector(".fring")) { ring.classList.add("hint"); $("spage").appendChild(ring); }
    if (s.tries === 2) say([C("f-schau")]);
  }
}

// ask: Mia, Mil or Max asks for help – which circle does this word live in?
function startAsk(a) {
  const w = findWord(a.word);
  if (!w) { endStep(0); return; }
  $("squiz").innerHTML = '<div class="sq askpic">' + faceHTML(w) + "</div>" +
    ARTS.map(x => '<button class="choice orb ' + x + '" data-a="' + x + '"><span class="ow">' + x + "</span></button>").join("");
  $("squiz").className = "squiz asking small"; $("squiz").hidden = false;
  kidPop(a.who);
  say([C("k-" + a.who + "-hilf"), C("f-welche")]);
}
function askTap(b) {
  const s = ST.step, a = s.data, w = findWord(a.word), ok = artOK(w, b.dataset.a);
  s.type = "";
  $("squiz").querySelectorAll(".choice").forEach(x => x.disabled = true);
  const thanks = () => { kidPop(a.who); return say([C("k-" + a.who + "-danke")]); };
  if (ok) {
    chime(); b.classList.add("right"); cheer(w.article, b); sparkle(b, 12); addStars();
    say([W(w)]).then(() => sleep(200)).then(thanks).then(() => endStep(300));
  } else {
    noteMiss(w, b.dataset.a);
    const rb = $("squiz").querySelector('.choice[data-a="' + w.article + '"]');
    oops(b, rb, w, { pic: $("squiz").querySelector(".askpic") }).then(() => sleep(200)).then(thanks).then(() => endStep(300));
  }
}

// q: she taps the right picture and hears it with its article
const findWord = (id) => allWords().find(w => w.id === id) || KNOWN_WORDS().find(w => w.id === id);
function askStory(q) {
  const choices = shuffle(q.choices.map(findWord).filter(Boolean));
  if (!choices.length) { endStep(0); return; }
  $("squiz").innerHTML = choices.map(w => '<button class="sq" data-id="' + esc(w.id) + '" aria-label="' + esc(w.noun) + '">' + faceHTML(w) + "</button>").join("");
  $("squiz").className = "squiz"; $("squiz").hidden = false;
  say([{ key: q.audio, text: q.text }]);
}
function qTap(b) {
  const q = ST.step.data, right = findWord(q.answer), ok = b.dataset.id === q.answer;
  ST.step.type = "";
  if (ok) { chime(); b.classList.add("right"); cheer(right.article, b); sparkle(b, 12); addStars(); say([C(pick(PRAISE)), W(right)]).then(() => endStep(300)); }
  else {
    const rb = $("squiz").querySelector('[data-id="' + q.answer + '"]');
    oops(b, rb, right).then(() => endStep(400));
  }
}
$("squiz").addEventListener("click", (e) => {

// Needs the microphone, so it runs in the GitHub version only (the Claude page blocks it).
// Speech recognition on children is imperfect, so feedback is always kind: great / almost / didn't hear.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micStream = null, recorder = null, micBroken = false, srConflict = false, listening = false;
// What the last recording did, shown in the grown-ups panel so a problem on one device can be pinned down.
const micStat = { tries: 0, err: "", last: "" };
const micAllowed = () => !micBroken && state.settings.record !== false && !window.claude && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

function releaseMic() {
  try { micStream && micStream.getTracks().forEach(tr => tr.stop()); } catch {}
  micStream = null; recorder = null;
  audioMode("playback");
  try { ctx().resume(); } catch {}
}
function stopRecording() { try { recorder && recorder.state === "recording" && recorder.stop(); } catch {} }
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function listenFor(ms) {                     // resolves to heard phrases, [] when silent, null when unavailable
  return new Promise((resolve) => {
    if (!SR) return resolve(null);
    let r; try { r = new SR(); } catch { return resolve(null); }
    r.lang = "de-DE"; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    const out = []; let done = false;
    const fin = (v) => { if (done) return; done = true; try { r.stop(); } catch {} resolve(v); };
    r.onresult = (e) => { for (const res of e.results) for (const alt of res) out.push(String(alt.transcript).toLowerCase()); fin(out); };
    r.onerror = (e) => {
      const off = ["audio-capture", "not-allowed", "service-not-allowed"].includes(e.error);   // this device won't recognise: stop asking

      fin(e.error === "no-speech" ? [] : (off ? null : out));

function judgeSpeech(alts, w) {
  const noun = norm(w.noun);
  let heardNoun = false, heardArt = false;
  for (const t of alts) {
    const toks = t.split(/[^a-zäöüß]+/).filter(Boolean).map(norm);
    toks.forEach((x, i) => {
      if (x === noun || lev(x, noun) <= (noun.length > 4 ? 2 : 1)) { heardNoun = true; if (artOK(w, toks[i - 1])) heardArt = true; }

// Watches the microphone level while she records: true once she has made a clear sound, null when it can't measure.
function voiceMeter(stream) {
  let spoke = false, loud = 0, peak = 0, timer = 0, src = null;
  try {
    const ac = ctx(); src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);

function unlockNext() {

async function recordHer(w) {
  if (listening) return;
  listening = true;
  const btn = $("micBtn");
  let her = null, verdict = null, spoke = null;
  try {
    stopAudio();
    btn.classList.add("rec"); btn.classList.remove("invite"); tone([880], "sine", .08);
    audioMode("play-and-record");
    try { await ctx().resume(); } catch {}
    // The recording and the voice meter always run for the full time; they decide whether she spoke.
    let recDone = Promise.resolve(null), meter = null;
    const t0 = Date.now();
    try {
      const tr = micStream && micStream.getAudioTracks()[0];
      if (!tr || tr.readyState === "ended") micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      meter = voiceMeter(micStream);
      if (typeof MediaRecorder !== "undefined") {
        const chunks = [];
        recorder = new MediaRecorder(micStream);
        recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        recDone = new Promise(r => recorder.onstop = () => r(chunks));
        recorder.start();

    micStat.tries++;

    const heard = srConflict ? null : await listenFor(3000);
    const left = 3000 - (Date.now() - t0);
    if (left > 0) await sleep(left);                // never cut her short, even when recognition gave up early
    stopRecording();
    spoke = meter ? meter.stop() : null;
    const chunks = await Promise.race([recDone, sleep(1500).then(() => null)]);
    const mime = (recorder && recorder.mimeType) || "audio/mp4";
    micStat.last = "level " + (meter && meter.peak != null ? meter.peak().toFixed(3) : "–") + ", " + (chunks ? chunks.length : 0) + " pieces, " + mime;
    releaseMic();
    btn.classList.remove("rec");
    if (chunks && chunks.length) {
      const data = await new Blob(chunks, { type: mime }).arrayBuffer();
      her = await Promise.race([sleep(2500).then(() => null),
        new Promise((res) => { const pr = ctx().decodeAudioData(data, res, () => res(null)); if (pr && pr.catch) pr.catch(() => res(null)); })]);

    }

  } catch (e) {
    console.warn("mic", e); micStat.err = "after recording: " + ((e && e.message) || e);
    releaseMic();
    btn.classList.remove("rec");
    if (!her && verdict === null) { micBroken = true; btn.hidden = true; listening = false; unlockNext(); return; }
  }
  const p = prog(w.id);
  if (S && S.card) S.card.tries++;
  // she spoke (the recogniser caught the word, or the mic heard her voice): let her go on; after 3 tries, don't keep her stuck
  const saidIt = verdict === "great" || verdict === "almost" || spoke === true || (spoke === null && !!her);
  if (saidIt || (S && S.card && S.card.tries >= 3)) unlockNext();
  if (verdict === "great") {
    chime(); cheer(w.article, btn); sparkle(btn, 14);
    if (S && S.card && !S.card.spoke) { S.card.spoke = true; addStars(); }
    logDay("s");
    setProg(w.id, { said: (p.said || 0) + 1 }); saveProgress();
    if (her) { await playBuffer(her); await sleep(200); }
    await say([C("f-supergesagt")]);
  } else if (verdict === "almost") {
    if (her) { await playBuffer(her); await sleep(200); }
    await say([C("f-fast"), W(w)]);
    btn.classList.add("invite");
  } else if (!saidIt) {
    await say([C("f-nichtgehoert")]);
    btn.classList.add("invite");
  } else {
    // she spoke but the recogniser missed the word: play her voice back next to Mila's
    await say([C("f-hoer")]);
    if (her) { await playBuffer(her); await sleep(250); }
    await say([W(w)]);
  }
  listening = false;
}

    (clipStat.el ? ", " + clipStat.el + " played directly" : "") + (clipStat.fail ? ", " + clipStat.fail + " failed" : "") +
    (clipStat.err ? '<br><span style="word-break:break-all">Last problem: ' + esc(clipStat.err) + "</span>" : "") + "</p>";
  body += '<p class="small" style="margin-top:4px">Microphone check: ' +
    (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? "microphone available" : "<b>no microphone access in this app</b>") +
    ", recorder " + (typeof MediaRecorder !== "undefined" ? "yes" : "no") + ", word check " + (SR ? "yes" : "no") +
    (micBroken ? ", <b>switched off after an error</b>" : "") + (state.settings.record === false ? ", <b>Speaking is set to Off</b>" : "") +
    (micStat.tries ? "<br>Last recording: " + esc(micStat.last || "none") : "") +
    (micStat.err ? '<br><span style="word-break:break-all">Last problem: ' + esc(micStat.err) + "</span>" : "") + "</p>";
  return '<section><h3>Voice</h3>' + body +
    '<div class="settings" style="margin-top:10px"><button class="btn" data-act="testclip">Test recorded voice</button>' +
    (hasTTS ? '<button class="btn" data-act="testvoice">Test iPad voice</button>' : "") + "</div></section>";
}
// The grown-ups' weekly summary: last 7 days from the daily log.
function weeklyReport() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
  const log = state.progress.log || {};
  const rows = days.map(d => ({ d, ...(log[d] || { st: 0, r: 0, q: 0, g: 0, s: 0 }) }));
  const sum = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
  const played = rows.filter(r => r.st || r.r || r.q || r.g).length;
  const max = Math.max(4, ...rows.map(r => r.st || 0));
  const wd = (d) => new Date(d + "T12:00").toLocaleDateString("en-GB", { weekday: "short" });
  const all = allWords(), known = all.filter(w => (prog(w.id).box || 0) >= MASTERED).length;
  const weak = all.filter(w => needsPractice(w)).slice(0, 8);
  const bars = rows.map(r => '<div class="wk-col"><div class="wk-bar" style="height:' + Math.round((r.st || 0) / max * 100) + '%" data-v="' + (r.st || 0) + ' ★"></div><span>' + (r.d === today() ? "Today" : wd(r.d)) + "</span></div>").join("");
  return '<section class="report"><h3>This week</h3>' +
    '<div class="stats wk-stats"><div><b>' + played + ' / 7</b>days played</div><div><b>' + sum("st") + '</b>stars</div><div><b>' + sum("r") + '</b>practice rounds</div><div><b>' + sum("q") + '</b>quizzes</div><div><b>' + sum("g") + '</b>games &amp; stories</div><div><b>' + sum("s") + '</b>words said right</div></div>' +
    '<div class="wk-chart" role="img" aria-label="Stars per day, last 7 days: ' + rows.map(r => wd(r.d) + " " + (r.st || 0)).join(", ") + '"><div class="wk-title">Stars per day</div><div class="wk-plot">' + bars + "</div></div>" +
    '<p style="margin-top:12px"><b>' + known + " of " + all.length + "</b> words known well." +
    (weak.length ? " Still tricky: " + weak.map(w => '<span class="chip ' + w.article + '" style="display:inline-block;padding:2px 10px;margin:2px">' + w.article + " " + esc(w.noun) + "</span>").join(" ") : " Nothing tricky right now.") + "</p>" + lettersReport() + "</section>";
}
function flash(text, err) { const m = $("msg"); if (m) { m.textContent = text; m.className = "msg" + (err ? " err" : ""); } }
function parseLines(text) {
  const out = [], bad = [];
  for (const raw of text.split(/\n+/)) {
    const line = raw.trim(); if (!line) continue;
    const [main, sent] = line.split("|");
    const m = main.trim().match(/^(der|die|das)\s+([A-Za-zÄÖÜäöüß-]+)\s*(.*)$/i);
    if (!m) { bad.push(line); continue; }
    const w = { article: m[1].toLowerCase(), noun: capNoun(m[2]), emoji: m[3].trim() || guessEmoji(m[2]) };
    if (sent && sent.trim()) w.s = sent.trim();
    out.push(w);
  }
  return { out, bad };
}
async function commitWords(msg) {
  state.words = normalizeWords(state.words);
  renderGrown();
  const ok = await saveWords();
  flash(ok ? msg : "Couldn't save. Check the connection and try again.", !ok);
}
function addOne() {
  const noun = ($("addNoun").value || "").trim();
  if (!/^[A-Za-zÄÖÜäöüß-]+$/.test(noun)) { flash("Type one word, like Hund.", true); return; }
  const w = { id: norm(noun), noun: capNoun(noun), article: addArt, emoji: ($("addEmoji").value || "").trim() || guessEmoji(noun) };
  const i = state.words.findIndex(x => x.id === w.id);
  if (i >= 0) state.words[i] = w; else state.words.push(w);
  state.sample = false;
  commitWords("Added " + w.article + " " + w.noun + ".");
}
$("sheet").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act !== "newlist" && act !== "reset") armed = "";
  if (act === "close") return closeGrown();
  if (act === "gate") { if (b.dataset.ok === "1") { gateOk = true; renderGrown(); } else renderGate(); return; }
  if (act === "art") { addArt = b.dataset.a; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.a === addArt)); return; }
  if (act === "add") return addOne();
  if (act === "drill") { const ws = allWords().filter(w => needsPractice(w)); closeGrown(); if (ws.length) startSession(ws); return; }
  if (act === "print") { openPrint(b.dataset.pairs === "1"); return; }
  if (act === "testclip") { say([C("p-super"), { key: "w-hund", text: "der Hund" }]); return; }
  if (act === "testvoice") { say("der Hund, die Katze, das Haus"); return; }
  if (act === "hear") { const w = state.words.find(x => x.id === b.dataset.id); if (w) say([W(w)]); return; }
  if (act === "delbank") { state.bank = state.bank.filter(x => x.id !== b.dataset.id); return commitWords("Removed."); }
  if (act === "del") { state.words = state.words.filter(x => x.id !== b.dataset.id); return commitWords("Removed."); }
  if (act === "bulk" || act === "newlist") {
    const { out, bad } = parseLines($("bulk").value || "");
    if (!out.length) { renderGrown(); flash("Nothing to add. Write lines like: der Hund", true); return; }
    if (act === "newlist" && armed !== "newlist") { const keep = $("bulk").value; armed = "newlist"; renderGrown(); $("bulk").value = keep; return; }
    armed = "";
    if (act === "newlist") { const old = state.words; state.words = []; for (const w of out) state.words.push(w); archiveWords(old); state.words = []; }
    for (const w of out) { const i = state.words.findIndex(x => x.id === norm(w.noun)); if (i >= 0) state.words.splice(i, 1); state.words.push(w); }
    state.sample = false;
    await commitWords((act === "newlist" ? "New list: " : "Added ") + out.length + " words." + (bad.length ? " Skipped: " + bad.join(", ") : ""));
    return;
  }
  if (act === "reset") {
    if (armed !== "reset") { armed = "reset"; renderGrown(); return; }
    armed = ""; state.progress = blankProgress(); saveProgress(); renderGrown(); return;
  }
});
$("gearBtn").addEventListener("click", openGrown);
$("voiceWarn").addEventListener("click", openGrown);

/* ---------- boot ---------- */
if (hasTTS) {
  pickVoice();
  try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch {}
  waitForVoices(3000).then(pickVoice);
}
renderHome();
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { state.mode = "local"; loadLocal(); renderHome(); applyDataFiles(); if (grownOpen) renderGrown(); return; }
  state.db = db; state.mode = "online";
  const onErr = (e) => { state.dbError = "Online storage stopped responding. Reload the page."; console.warn(e); if (grownOpen) renderGrown(); };
  db.doc("lists/current").onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : null;
    state.words = normalizeWords(d && d.words);
    state.bank = normalizeWords(d && d.bank);
    state.sample = !!(d && d.sample);
    state.settings = { ...state.settings, ...((d && d.settings) || {}) }; fixPace();
    state.wordsLoaded = true;
    applyDataFiles();
    if (!busy()) renderHome();
    if (grownOpen && !document.activeElement?.matches?.("input,textarea,select")) renderGrown();
  }, onErr);
  db.doc("progress/main").onSnapshot((snap) => {
    if (progSaving || busy() || snap.metadata.hasPendingWrites) return;
    state.progress = normalizeProgress(snap.exists ? snap.data() : null);
    renderHome();
    if (grownOpen && !document.activeElement?.matches?.("input,textarea,select")) renderGrown();
  }, onErr);
})();
})();
</script>
</body></html>
