  $("bdots").innerHTML = Array.from({ length: BUB_GOAL }, (_, i) => '<span class="dot' + (i < B.got ? " " + a : "") + (i === B.got ? " now" : "") + '"></span>').join("");
}
function nextBubRound() {
  const b = B; b.r++; b.got = 0; b.live = false;
  if (b.r >= b.rounds.length) return finishBubbles();
  const a = b.rounds[b.r], fr = $("bfriend");
  fr.querySelector(".orb").className = "orb " + a;
  $("blabel").className = "blabel " + a; $("blabel").textContent = a;
  fr.className = "bfriend intro"; renderBDots();
  sparkle(fr, 12); chime();
  sleep(450).then(() => say([ART(a)], 0.8)).then(() => sleep(250)).then(() => {
    if (B !== b) return;
    fr.classList.remove("intro"); b.live = true; b.next = 0;
  });
}
function spawnBubble(b, W, H) {
  const a = b.rounds[b.r], live = b.bubs.filter(x => !x.done);
  const wantTarget = !live.some(x => x.w.article === a) || Math.random() < 0.5;
  const onScreen = new Set(live.map(x => x.w.id));
  const pool = b.pool.filter(w => (w.article === a) === wantTarget && !onScreen.has(w.id));
  if (!pool.length) return;
  const w = pick(pool), size = Math.min(160, Math.max(92, Math.min(W, H) * .16)) * (0.88 + Math.random() * .24);
  const el = document.createElement("div");
  el.className = "bub"; el.dataset.id = w.id; el.style.setProperty("--s", size + "px");
  el.innerHTML = '<span class="face">' + faceHTML(w) + "</span>";
  // spread them out: start away from the bubbles that are still low on the screen
  let x = 0;
  for (let k = 0; k < 6; k++) { x = size / 2 + 10 + Math.random() * (W - size - 20); if (!live.some(o => o.y > H * .55 && Math.abs(o.x - x) < size)) break; }
  const bb = { w, el, s: size, x, y: H + size / 2, vy: H / (7 - b.r * 1.3) * (0.9 + Math.random() * .2), amp: 10 + Math.random() * 16, f: 1 + Math.random(), ph: Math.random() * 6, done: false };
  el.style.translate = (x - size / 2) + "px " + (bb.y - size / 2) + "px";
  $("bfield").appendChild(el); b.bubs.push(bb);
}
function bubLoop(b, t) {
  if (B !== b) return;
  const dt = b.last ? Math.min(.05, (t - b.last) / 1000) : 0; b.last = t;
  const F = $("bfield"), W = F.clientWidth, H = F.clientHeight;
  if (b.live && t >= b.next && b.bubs.filter(x => !x.done).length < 3 + b.r) {
    spawnBubble(b, W, H); b.next = t + (1250 - b.r * 220) * (0.8 + Math.random() * .4);
  }
  for (const x of b.bubs) {
    if (x.done) continue;
    x.y -= x.vy * dt;
    const px = x.x + Math.sin(t / 1000 * x.f + x.ph) * x.amp;
    x.cx = px; x.el.style.translate = (px - x.s / 2) + "px " + (x.y - x.s / 2) + "px";
    if (x.y < -x.s) { x.done = true; x.el.remove(); }
  }
  b.bubs = b.bubs.filter(x => !x.done || x.el.isConnected);
  requestAnimationFrame(tt => bubLoop(b, tt));
}
function bubLook(x, y) {
  const o = $("bfriend").querySelector(".orb"), r = o.getBoundingClientRect(); if (!r.width) return;
  const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height * .35), d = Math.hypot(dx, dy) || 1;
  o.style.setProperty("--lx", (dx / d * 3).toFixed(2) + "cqw"); o.style.setProperty("--ly", (dy / d * 3).toFixed(2) + "cqw");
}
$("bfield").addEventListener("pointerdown", (e) => {
  bubLook(e.clientX, e.clientY);
  const el = e.target.closest(".bub"), b = B;
  if (!el || !b || !b.live) return;
  const bb = b.bubs.find(x => x.el === el); if (!bb || bb.done || bb.miss) return;
  const a = b.rounds[b.r], fr = $("bfriend");
  if (bb.w.article === a) {
    bb.done = true; b.got++; b.hits++; b.streak++; scoreWord(bb.w.id, true, b.scored);
    if (!b.popped.includes(bb.w)) b.popped.push(bb.w);
    tone([520 + Math.min(b.streak, 10) * 70], "sine", 0.12, 0.1, 0.18);
    // the picture flies into the friend's mouth, the bubble bursts
    const face = el.querySelector(".face");
    flyTo(face, fr.querySelector(".orb")); munch(fr, 650);
    el.classList.add("pop"); sparkle(el, 8);
    setTimeout(() => el.remove(), 320);
    say([W(bb.w)]);
    if (b.hits % 3 === 0) { addStars(); b.earned++; }
    if (b.streak > 0 && b.streak % 5 === 0) { const c = $("bcombo"); c.textContent = "★ " + b.streak; restart(c, "show"); confetti(); }
    renderBDots();
    if (b.got >= BUB_GOAL) {
      b.live = false;
      setTimeout(() => {
        if (B !== b) return;
        b.bubs.forEach(x => { if (!x.done) { x.done = true; x.el.classList.add("pop"); setTimeout(() => x.el.remove(), 320); } });
        say([C(pick(PRAISE))]).then(() => { if (B === b) nextBubRound(); });
      }, 900);
    }
  } else {
    bb.miss = true; b.streak = 0; noteMiss(bb.w, a); scoreWord(bb.w.id, false, b.scored);
    el.classList.add("miss"); boop(); retrigger(fr, "nope", 550);
    say([W(bb.w)]);
  }
});
function finishBubbles() {
  const b = B; if (!b) return;
  b.bubs.forEach(x => x.el.remove());
  const rows = b.popped.slice(0, 12).map(w => ({ w, mark: "ok" }));
  const earned = b.earned, grew = markDay(); logDay("g");
  B = null; lastActivity = "bubbles";
  state.progress.lastPlayed = today(); saveProgress();
  showDone(earned, rows, stickersNow(), quizDue(), grew);
}

/* ---------- "Stimmt das?": a grown-up answers (sometimes wrong on purpose), she judges ---------- */
function startJudge() {
  if (state.words.length < 3) return;
  J = { words: mixWords(Math.min(6, state.words.length + 2), 2), i: 0, earned: 0, res: {}, phase: "", claim: "" };
  renderStars(); show("judge"); nextJudge(true);
}
function renderJDots() { $("jdots").innerHTML = J.words.map((w, i) => '<span class="dot ' + (w.id in J.res ? (J.res[w.id] ? "ok" : "miss") : "") + (i === J.i ? " now" : "") + '"></span>').join(""); }
const jPicEl = () => $("jPic").hidden ? $("jEmoji") : $("jPic");
function jTurn(who) { $("whoBig").classList.toggle("on", who === "big"); $("whoKid").classList.toggle("on", who === "kid"); }
function nextJudge(first) {
  if (J.i >= J.words.length) return finishJudge();
  const w = J.words[J.i];
  J.phase = "big"; J.claim = "";
  setPicture($("jPic"), $("jEmoji"), w);
  $("jCaption").className = "caption"; $("jCaption").innerHTML = "";
  $("jClaim").hidden = true;
  $("jcard").className = "card"; restart($("jcard"), "enter");
  document.querySelectorAll("#jChoices .choice").forEach(b => { b.disabled = false; b.className = "choice orb " + b.dataset.a; });
  $("jChoices").hidden = false; restart($("jChoices"), "enter");
  $("jThumbs").hidden = true;
  jTurn("big"); renderJDots();
  if (first) say([C("f-grosse")]);
}
function jReveal(w, ok) {
  $("jcard").className = "card " + w.article;
  $("jCaption").innerHTML = '<span class="art ' + w.article + '">' + w.article + "</span> " + esc(w.noun);
  $("jCaption").className = "caption show";
  J.res[w.id] = ok; scoreWord(w.id, ok);
  if (ok) { J.earned++; addStars(); }
  renderJDots();
}
function jNext(spoken) { const my = J; spoken.then(() => sleep(900)).then(() => { if (J === my) { J.i++; nextJudge(false); } }); }
document.querySelectorAll("#jChoices .choice").forEach(btn => btn.addEventListener("click", () => {
  if (!J) return;
  const w = J.words[J.i], a = btn.dataset.a;
  if (J.phase === "big") {
    // grown-up's claim: shown as a coloured chip and said as a question; the right phrase always follows her judgement
    J.claim = a; J.phase = "kid";
    $("jClaim").className = "claim " + a;
    $("jClaim").innerHTML = '<span class="by">' + $("whoBig").innerHTML + '</span><svg class="sym" viewBox="0 0 20 20">' + SYMS[a] + "</svg>" + a;
    $("jClaim").hidden = false;
    $("jChoices").hidden = true;
    $("jThumbs").hidden = false; restart($("jThumbs"), "enter");
    jTurn("kid"); pop();
    say([Qs(w, a), C("f-stimmt")]);
  } else if (J.phase === "fix") {
    J.phase = "";
    document.querySelectorAll("#jChoices .choice").forEach(b => b.disabled = true);
    const ok = artOK(w, a);
    if (ok) { chime(); btn.classList.add("right"); cheer(a, btn); jReveal(w, true); jNext(say([C(pick(PRAISE)), W(w)])); }
    else { noteMiss(w, a); jReveal(w, false); jNext(oops(btn, document.querySelector('#jChoices .choice[data-a="' + w.article + '"]'), w, { pic: jPicEl() })); }
  }
}));
function judge(saysRight) {
  if (!J || J.phase !== "kid") return;
  const w = J.words[J.i], claimRight = artOK(w, J.claim);
  $("jThumbs").hidden = true;
  if (saysRight && claimRight) { J.phase = ""; chime(); cheer(w.article, $("jcard")); jReveal(w, true); jNext(say([C("f-jastimmt"), W(w)])); }
  else if (!saysRight && !claimRight) {
    // she caught the mistake: now she shows the right house
    J.phase = "fix"; chime(); sparkle($("jClaim"), 10);
    document.querySelectorAll("#jChoices .choice").forEach(b => { b.disabled = b.dataset.a === J.claim; b.className = "choice orb " + b.dataset.a + (b.dataset.a === J.claim ? " wrong" : ""); });
    $("jChoices").hidden = false; restart($("jChoices"), "enter");
    say([C("f-nein"), C("f-welche")]);
  } else {
    J.phase = ""; jReveal(w, false);
    document.querySelectorAll("#jChoices .choice").forEach(b => { b.disabled = true; b.className = "choice orb " + b.dataset.a; });
    $("jChoices").hidden = false; restart($("jChoices"), "enter");
    const orb = (x) => document.querySelector('#jChoices .choice[data-a="' + x + '"]');
    jNext(oops(saysRight ? orb(J.claim) : null, orb(w.article), w, { pic: jPicEl() }));
  }
}
$("jYes").addEventListener("click", () => judge(true));
$("jNo").addEventListener("click", () => judge(false));
$("jListen").addEventListener("click", () => {
  if (!J || !J.words[J.i]) return;
  const w = J.words[J.i];
  if (J.phase === "") say([W(w)]); else if (J.phase === "kid") say([Qs(w, J.claim), C("f-stimmt")]); else say([C("f-grosse")]);
});
function finishJudge() {
  const rows = J.words.map(w => ({ w, mark: J.res[w.id] ? "ok" : "miss" }));
  const earned = J.earned, grew = markDay(); logDay("g");
  J = null; lastActivity = "judge";
  state.progress.lastPlayed = today(); saveProgress();
  showDone(earned, rows, stickersNow(), quizDue(), grew);
}

// Articles are coloured, and kept on the same line as their noun ("die" never waits alone at the end of a line).
function colourText(t) {
  const toks = esc(t).split(/(\s+)/), out = [];
  for (let i = 0; i < toks.length; i++) {
    const tok = toks[i], a = tok.toLowerCase().replace(/[^a-zäöüß]/g, "");
    if (!ARTS.includes(a) && a !== "den") { out.push(tok); continue; }
    const art = '<span class="wd ' + a + '">' + tok + "</span>";
    if (i + 2 < toks.length && /^\s+$/.test(toks[i + 1])) { out.push('<span class="nb">' + art + " " + toks[i + 2] + "</span>"); i += 2; }
    else out.push(art);
  }
  return out.join("");
}

/* ---------- speak to the app: she says it, gets gentle feedback and hears herself ---------- */
// Needs the microphone, so it runs in the GitHub version only (the Claude page blocks it).
// Speech recognition on children is imperfect, so feedback is always kind: great / almost / didn't hear.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micStream = null, recorder = null, micBroken = false, srConflict = false, listening = false;
// What the last recording did, shown in the grown-ups panel so a problem on one device can be pinned down.
const micStat = { tries: 0, err: "", last: "" };
const micAllowed = () => !micBroken && state.settings.record !== false && !window.claude && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
// Turn the microphone fully off after each recording, otherwise the iPad stays in "call mode" and plays sound very quietly.
function releaseMic() {
  try { micStream && micStream.getTracks().forEach(tr => tr.stop()); } catch {}
  micStream = null; recorder = null;
  audioMode("playback");
  try { ctx().resume(); } catch {}
  soundSuspect = true;
}
function stopRecording() { try { recorder && recorder.state === "recording" && recorder.stop(); } catch {} }
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function listenFor(ms) {                     // resolves to heard phrases, [] when silent, null when unavailable
  return new Promise((resolve) => {
    if (!SR) return resolve(null);
    let r; try { r = new SR(); } catch { return resolve(null); }
    r.lang = "de-DE"; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    const out = []; let done = false;
    const fin = (v) => { if (done) return; done = true; try { r.stop(); } catch {} resolve(v); };
    r.onresult = (e) => { for (const res of e.results) for (const alt of res) out.push(String(alt.transcript).toLowerCase()); fin(out); };
    r.onerror = (e) => {
      const off = ["audio-capture", "not-allowed", "service-not-allowed"].includes(e.error);   // this device won't recognise: stop asking
      if (off) srConflict = true;
      fin(e.error === "no-speech" ? [] : (off ? null : out));
    };
    r.onend = () => fin(out);
    try { r.start(); } catch { fin(null); }
    setTimeout(() => fin(out), ms);
  });
}
function judgeSpeech(alts, w) {
  const noun = norm(w.noun);
  let heardNoun = false, heardArt = false;
  for (const t of alts) {
    const toks = t.split(/[^a-zäöüß]+/).filter(Boolean).map(norm);
    toks.forEach((x, i) => {
      if (x === noun || lev(x, noun) <= (noun.length > 4 ? 2 : 1)) { heardNoun = true; if (artOK(w, toks[i - 1])) heardArt = true; }
    });
  }
  return heardArt ? "great" : heardNoun ? "almost" : "none";
}
// Watches the microphone level while she records: true once she has made a clear sound, null when it can't measure.
function voiceMeter(stream) {
  let spoke = false, loud = 0, peak = 0, timer = 0, src = null;
  try {
    const ac = ctx(); src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    timer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let s = 0; for (const v of buf) s += v * v;
      const rms = Math.sqrt(s / buf.length); peak = Math.max(peak, rms);
      if (rms > 0.02) { if (++loud >= 3) spoke = true; } else loud = Math.max(0, loud - 1);
    }, 50);
  } catch { return { stop: () => null, peak: () => null }; }
  // a meter that saw pure digital silence isn't hearing the mic at all: report "don't know" instead of "silent"
  return { stop: () => { clearInterval(timer); try { src.disconnect(); } catch {} return peak === 0 ? null : spoke; }, peak: () => peak };
}
function unlockNext() {
  if (!S || !S.card || !$("nextBtn").disabled) return;
  $("nextBtn").disabled = false; bump($("nextBtn"));
}
async function recordHer(w) {
  if (listening) return;
  listening = true;
  const btn = $("micBtn");
  let her = null, verdict = null, spoke = null;
  try {
    stopAudio();
    btn.classList.add("rec"); btn.classList.remove("invite"); tone([880], "sine", .08);
    audioMode("play-and-record");
    try { await ctx().resume(); } catch {}
    // The recording and the voice meter always run for the full time; they decide whether she spoke.
    let recDone = Promise.resolve(null), meter = null;
    const t0 = Date.now();
    try {
      const tr = micStream && micStream.getAudioTracks()[0];
      if (!tr || tr.readyState === "ended") micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      meter = voiceMeter(micStream);
      if (typeof MediaRecorder !== "undefined") {
        const chunks = [];
        recorder = new MediaRecorder(micStream);
        recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        recDone = new Promise(r => recorder.onstop = () => r(chunks));
        recorder.start();
      }
    } catch (e) { recDone = Promise.resolve(null); micStat.err = (e && (e.name ? e.name + ": " : "") + (e.message || "")) || String(e); }
    micStat.tries++;
    // Speech recognition is only a bonus for "Super gesagt!"; on some iPads it fails at once or can't share the mic.
    const heard = srConflict ? null : await listenFor(3000);
    const left = 3000 - (Date.now() - t0);
    if (left > 0) await sleep(left);                // never cut her short, even when recognition gave up early
    stopRecording();
    spoke = meter ? meter.stop() : null;
    const chunks = await Promise.race([recDone, sleep(1500).then(() => null)]);
    const mime = (recorder && recorder.mimeType) || "audio/mp4";
    micStat.last = "level " + (meter && meter.peak != null ? meter.peak().toFixed(3) : "–") + ", " + (chunks ? chunks.length : 0) + " pieces, " + mime;
    releaseMic();
    btn.classList.remove("rec");
    if (chunks && chunks.length) {
      const data = await new Blob(chunks, { type: mime }).arrayBuffer();
      her = await Promise.race([sleep(2500).then(() => null),
        new Promise((res) => { const pr = ctx().decodeAudioData(data, res, () => res(null)); if (pr && pr.catch) pr.catch(() => res(null)); })]);
      if (!her) micStat.last += ", couldn't play it back";
    }
    verdict = heard === null ? null : judgeSpeech(heard, w);
  } catch (e) {
    console.warn("mic", e); micStat.err = "after recording: " + ((e && e.message) || e);
    releaseMic();
    btn.classList.remove("rec");
    if (!her && verdict === null) { micBroken = true; btn.hidden = true; listening = false; unlockNext(); return; }
  }
  const p = prog(w.id);
  if (S && S.card) S.card.tries++;
  // she spoke (the recogniser caught the word, or the mic heard her voice): let her go on; after 3 tries, don't keep her stuck
  const saidIt = verdict === "great" || verdict === "almost" || spoke === true || (spoke === null && !!her);
  if (saidIt || (S && S.card && S.card.tries >= 3)) unlockNext();
  if (verdict === "great") {
    chime(); cheer(w.article, btn); sparkle(btn, 14);
    if (S && S.card && !S.card.spoke) { S.card.spoke = true; addStars(); }
    logDay("s");
    setProg(w.id, { said: (p.said || 0) + 1 }); saveProgress();
    if (her) { await playBuffer(her); await sleep(200); }
    await say([C("f-supergesagt")]);
  } else if (verdict === "almost") {
    if (her) { await playBuffer(her); await sleep(200); }
    await say([C("f-fast"), W(w)]);
    btn.classList.add("invite");
  } else if (!saidIt) {
    await say([C("f-nichtgehoert")]);
    btn.classList.add("invite");
  } else {
    // she spoke but the recogniser missed the word: play her voice back next to Mila's
    await say([C("f-hoer")]);
    if (her) { await playBuffer(her); await sleep(250); }
    await say([W(w)]);
  }
  listening = false;
}

      '<input type="text" id="addEmoji" placeholder="🐶" autocomplete="off" aria-label="Picture (emoji)">' +
      '<button class="btn primary" data-act="add">Add</button></div>' +
      '<p class="small" style="margin-top:6px">New words show their emoji until Claude makes a picture and a recording for them.</p></section>' +
    '<section><h3>Paste a list</h3><textarea id="bulk" placeholder="der Hund 🐶&#10;die Katze&#10;das Haus 🏠"></textarea>' +
      '<div class="addrow" style="margin-top:8px"><button class="btn primary" data-act="bulk">Add these words</button>' +
      '<button class="btn danger' + (armed === "newlist" ? " armed" : "") + '" data-act="newlist">' + (armed === "newlist" ? "Tap again: replace the whole list" : "Start a new list") + "</button></div>" +
      '<p class="small" style="margin-top:6px">One word per line: article, word and an optional emoji. <b>Start a new list</b> replaces all words with the ones in the box (stars, stickers and progress are kept).</p>' +
      '<p class="msg" id="msg"></p></section>' +
    '<section><h3>Hand signs &amp; circle friends</h3><p>The voice is Mila, the teacher from her school book: tap her face to hear a word again. The three circle friends are called DER (blue), DIE (red) and DAS (yellow), the same colours as at school. A practice round can start with a short colour warm-up: Mila says der, die or das and she taps the matching circle (off unless you switch it on below). Tap Mila on the home screen and the three circles light up while she says der, die, das. Show her once: she makes the sign while saying the word out loud. <b>der</b> = fist ✊, <b>die</b> = one finger pointing up ☝️, <b>das</b> = flat hand ✋. The peace sign ✌️ pops up when she gets one right. If her teacher uses different signs, follow the teacher.</p></section>' +
    '<section><h3>Print word cards</h3><p class="small">Cards with the picture, the coloured circle and the word, for Memory or snap at the table. Cut along the dashed lines.</p>' +
      '<div class="settings" style="margin-top:10px"><button class="btn" data-act="print" data-pairs="0">One card per word</button><button class="btn" data-act="print" data-pairs="1">Memory set (pairs)</button></div></section>' +
    voiceSection() +
    '<section><h3>Progress</h3><div class="stats">' +
      "<div><b>" + state.progress.stars + "</b>stars</div><div><b>" + state.progress.stickers.length + " / " + STICKERS.length + "</b>stickers</div><div><b>" + Math.max(0, state.progress.points - (state.progress.pointsUsed || 0)) + " / " + perSticker() + "</b>stars to next sticker</div>" +
      "<div><b>" + state.progress.sessions + "</b>practice rounds</div><div><b>" + state.progress.quizzes + "</b>quizzes</div>" +
      "<div><b>" + mastered + " / " + state.words.length + "</b>words starred</div><div><b>" + esc(state.progress.lastPlayed || "–") + "</b>last played</div></div>" +
      '<div class="settings" style="margin-top:14px"><label for="lenSel">Words per round</label><select id="lenSel">' +
      [5, 6, 8, 10, 12].map(n => '<option value="' + n + '"' + (Number(state.settings.sessionLength) === n ? " selected" : "") + ">" + n + "</option>").join("") +
      '</select><label for="learnSel">A word is learned after</label><select id="learnSel">' +
      [3, 4, 5].map(n => '<option value="' + n + '"' + (MASTERED === n ? " selected" : "") + ">" + n + " right answers in a row</option>").join("") +
      '</select><label for="quizSel">Quiz after</label><select id="quizSel">' +
      [1, 2, 3, 4].map(n => '<option value="' + n + '"' + ((Number(state.settings.quizEvery) || 2) === n ? " selected" : "") + ">" + n + " round" + (n > 1 ? "s" : "") + "</option>").join("") +
      '</select><label for="stkSel">Sticker every</label><select id="stkSel">' +
      [15, 20, 30, 40, 50].map(n => '<option value="' + n + '"' + (perSticker() === n ? " selected" : "") + ">" + n + " stars</option>").join("") +
      '</select><label for="recSel">Speaking</label><select id="recSel"><option value="on"' + (state.settings.record !== false ? " selected" : "") + '>On: she speaks, gets feedback, hears herself</option><option value="off"' + (state.settings.record === false ? " selected" : "") + '>Off</option>' +
      '</select><label for="warmSel">Colour warm-up before practice</label><select id="warmSel"><option value="on"' + (state.settings.warmup === true ? " selected" : "") + '>On (6 quick taps on blue/red/yellow)</option><option value="off"' + (state.settings.warmup !== true ? " selected" : "") + '>Off</option>' +
      '</select><label for="mustSel">Must speak before next word</label><select id="mustSel"><option value="on"' + (state.settings.mustSpeak !== false ? " selected" : "") + '>Yes</option><option value="off"' + (state.settings.mustSpeak === false ? " selected" : "") + '>No</option>' +
      '</select><label for="firstSel">Say the answer first</label><select id="firstSel">' +
      '<option value="always"' + (state.settings.sayFirst !== "new" ? " selected" : "") + '>Always</option>' +
      '<option value="new"' + (state.settings.sayFirst === "new" ? " selected" : "") + '>Only for new words, then she remembers it herself</option>' +
      '</select><button class="btn danger' + (armed === "reset" ? " armed" : "") + '" data-act="reset">' + (armed === "reset" ? "Tap again: clear stars, stickers and progress" : "Reset progress") + "</button></div></section>";
  const nounIn = $("addNoun"), emoIn = $("addEmoji");
  nounIn.addEventListener("input", () => { if (!emoIn.dataset.touched) emoIn.value = guessEmoji(nounIn.value); });
  emoIn.addEventListener("input", () => { emoIn.dataset.touched = emoIn.value ? "1" : ""; });
  nounIn.addEventListener("keydown", (e) => { if (e.key === "Enter") addOne(); });
  $("lenSel").addEventListener("change", (e) => { state.settings.sessionLength = Number(e.target.value); saveWords(); });
  $("warmSel").addEventListener("change", (e) => { state.settings.warmup = e.target.value === "on"; saveWords(); });
  $("mustSel").addEventListener("change", (e) => { state.settings.mustSpeak = e.target.value === "on"; saveWords(); });
  $("recSel").addEventListener("change", (e) => { state.settings.record = e.target.value === "on"; saveWords(); });
  $("stkSel").addEventListener("change", (e) => { state.settings.perSticker = Number(e.target.value); saveWords(); });
  $("quizSel").addEventListener("change", (e) => { state.settings.quizEvery = Number(e.target.value); saveWords(); });
  $("learnSel").addEventListener("change", (e) => { state.settings.learnAfter = Number(e.target.value); syncLearn(); saveWords(); const y = $("grown").scrollTop; renderGrown(); $("grown").scrollTop = y; renderHome(); });
  $("voiceSel")?.addEventListener("change", (e) => { try { localStorage.setItem(LS_VOICE, e.target.value); } catch {} pickVoice(); say("der Hund"); });
  $("firstSel").addEventListener("change", (e) => { state.settings.sayFirst = e.target.value; saveWords(); });
}
function voiceSection() {
  const de = germanVoices();
  const fix = "On the iPad: Settings → Accessibility → Spoken Content → Voices → German. Download a voice (Anna sounds natural), then reload this page.";
  let body = '<p>The built-in words and all praise use a recorded voice (Mila). Words you add yourself use the iPad’s German voice until Claude records them.</p>';
  if (!hasTTS) body += '<p class="note">This browser cannot speak added words. Open the page in Safari on the iPad.</p>';
  else if (!de.length) body += '<p class="note hot"><strong>No German iPad voice found' + (voiceStatus === "unknown" ? " yet" : "") + ".</strong> Added words would be read in English. " + esc(fix) + "</p>";
  else body += '<div class="settings" style="margin-top:10px"><label for="voiceSel">iPad voice for added words</label><select id="voiceSel">' +
      de.map(v => '<option value="' + esc(v.voiceURI) + '"' + (deVoice && v.voiceURI === deVoice.voiceURI ? " selected" : "") + ">" + esc(v.name + " (" + v.lang + ")") + "</option>").join("") +
      '</select></div>';
  body += '<p class="small" style="margin-top:8px">Recorded voice check (version ' + AUDIO_V + "): " + clipStat.ok + " clips loaded" +
    (clipStat.el ? ", " + clipStat.el + " played directly" : "") + (clipStat.fail ? ", " + clipStat.fail + " failed" : "") +
    (soundStat.fresh ? ", sound restarted " + soundStat.fresh + "× (last: " + esc(soundStat.why) + ")" : "") +
    (clipStat.err ? '<br><span style="word-break:break-all">Last problem: ' + esc(clipStat.err) + "</span>" : "") + "</p>";
  body += '<p class="small" style="margin-top:4px">Microphone check: ' +
    (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? "microphone available" : "<b>no microphone access in this app</b>") +
    ", recorder " + (typeof MediaRecorder !== "undefined" ? "yes" : "no") + ", word check " + (SR ? "yes" : "no") +
    (micBroken ? ", <b>switched off after an error</b>" : "") + (state.settings.record === false ? ", <b>Speaking is set to Off</b>" : "") +
    (micStat.tries ? "<br>Last recording: " + esc(micStat.last || "none") : "") +
    (micStat.err ? '<br><span style="word-break:break-all">Last problem: ' + esc(micStat.err) + "</span>" : "") + "</p>";
  return '<section><h3>Voice</h3>' + body +
    '<div class="settings" style="margin-top:10px"><button class="btn" data-act="testclip">Test recorded voice</button>' +
    (hasTTS ? '<button class="btn" data-act="testvoice">Test iPad voice</button>' : "") + "</div></section>";
}
// The grown-ups' weekly summary: last 7 days from the daily log.
function weeklyReport() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(today(), i - 6));
  const log = state.progress.log || {};
  const rows = days.map(d => ({ d, ...(log[d] || { st: 0, r: 0, q: 0, g: 0, s: 0 }) }));
  const sum = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
  const played = rows.filter(r => r.st || r.r || r.q || r.g).length;
  const max = Math.max(4, ...rows.map(r => r.st || 0));
  const wd = (d) => new Date(d + "T12:00").toLocaleDateString("en-GB", { weekday: "short" });
  const all = allWords(), known = all.filter(w => (prog(w.id).box || 0) >= MASTERED).length;
  const weak = all.filter(w => needsPractice(w)).slice(0, 8);
  const bars = rows.map(r => '<div class="wk-col"><div class="wk-bar" style="height:' + Math.round((r.st || 0) / max * 100) + '%" data-v="' + (r.st || 0) + ' ★"></div><span>' + (r.d === today() ? "Today" : wd(r.d)) + "</span></div>").join("");
  return '<section class="report"><h3>This week</h3>' +
    '<div class="stats wk-stats"><div><b>' + played + ' / 7</b>days played</div><div><b>' + sum("st") + '</b>stars</div><div><b>' + sum("r") + '</b>practice rounds</div><div><b>' + sum("q") + '</b>quizzes</div><div><b>' + sum("g") + '</b>games &amp; stories</div><div><b>' + sum("s") + '</b>words said right</div></div>' +
    '<div class="wk-chart" role="img" aria-label="Stars per day, last 7 days: ' + rows.map(r => wd(r.d) + " " + (r.st || 0)).join(", ") + '"><div class="wk-title">Stars per day</div><div class="wk-plot">' + bars + "</div></div>" +
    '<p style="margin-top:12px"><b>' + known + " of " + all.length + "</b> words known well." +
    (weak.length ? " Still tricky: " + weak.map(w => '<span class="chip ' + w.article + '" style="display:inline-block;padding:2px 10px;margin:2px">' + w.article + " " + esc(w.noun) + "</span>").join(" ") : " Nothing tricky right now.") + "</p>" + lettersReport() + "</section>";
}
function flash(text, err) { const m = $("msg"); if (m) { m.textContent = text; m.className = "msg" + (err ? " err" : ""); } }
function parseLines(text) {
  const out = [], bad = [];
  for (const raw of text.split(/\n+/)) {
    const line = raw.trim(); if (!line) continue;
    const [main, sent] = line.split("|");
    const m = main.trim().match(/^(der|die|das)\s+([A-Za-zÄÖÜäöüß-]+)\s*(.*)$/i);
    if (!m) { bad.push(line); continue; }
    const w = { article: m[1].toLowerCase(), noun: capNoun(m[2]), emoji: m[3].trim() || guessEmoji(m[2]) };
    if (sent && sent.trim()) w.s = sent.trim();
    out.push(w);
  }
  return { out, bad };
}
async function commitWords(msg) {
  state.words = normalizeWords(state.words);
  renderGrown();
  const ok = await saveWords();
  flash(ok ? msg : "Couldn't save. Check the connection and try again.", !ok);
}
function addOne() {
  const noun = ($("addNoun").value || "").trim();
  if (!/^[A-Za-zÄÖÜäöüß-]+$/.test(noun)) { flash("Type one word, like Hund.", true); return; }
  const w = { id: norm(noun), noun: capNoun(noun), article: addArt, emoji: ($("addEmoji").value || "").trim() || guessEmoji(noun) };
  const i = state.words.findIndex(x => x.id === w.id);
  if (i >= 0) state.words[i] = w; else state.words.push(w);
  state.sample = false;
  commitWords("Added " + w.article + " " + w.noun + ".");
}
$("sheet").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act !== "newlist" && act !== "reset") armed = "";
  if (act === "close") return closeGrown();
  if (act === "gate") { if (b.dataset.ok === "1") { gateOk = true; renderGrown(); } else renderGate(); return; }
  if (act === "art") { addArt = b.dataset.a; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.a === addArt)); return; }
  if (act === "add") return addOne();
  if (act === "drill") { const ws = allWords().filter(w => needsPractice(w)); closeGrown(); if (ws.length) startSession(ws); return; }
  if (act === "print") { openPrint(b.dataset.pairs === "1"); return; }
  if (act === "testclip") { say([C("p-super"), { key: "w-hund", text: "der Hund" }]); return; }
  if (act === "testvoice") { say("der Hund, die Katze, das Haus"); return; }
  if (act === "hear") { const w = state.words.find(x => x.id === b.dataset.id); if (w) say([W(w)]); return; }
  if (act === "delbank") { state.bank = state.bank.filter(x => x.id !== b.dataset.id); return commitWords("Removed."); }
  if (act === "del") { state.words = state.words.filter(x => x.id !== b.dataset.id); return commitWords("Removed."); }
  if (act === "bulk" || act === "newlist") {
    const { out, bad } = parseLines($("bulk").value || "");
    if (!out.length) { renderGrown(); flash("Nothing to add. Write lines like: der Hund", true); return; }
    if (act === "newlist" && armed !== "newlist") { const keep = $("bulk").value; armed = "newlist"; renderGrown(); $("bulk").value = keep; return; }
    armed = "";
    if (act === "newlist") { const old = state.words; state.words = []; for (const w of out) state.words.push(w); archiveWords(old); state.words = []; }
    for (const w of out) { const i = state.words.findIndex(x => x.id === norm(w.noun)); if (i >= 0) state.words.splice(i, 1); state.words.push(w); }
    state.sample = false;
    await commitWords((act === "newlist" ? "New list: " : "Added ") + out.length + " words." + (bad.length ? " Skipped: " + bad.join(", ") : ""));
    return;
  }
  if (act === "reset") {
    if (armed !== "reset") { armed = "reset"; renderGrown(); return; }
    armed = ""; state.progress = blankProgress(); saveProgress(); renderGrown(); return;
  }
});
$("gearBtn").addEventListener("click", openGrown);
$("voiceWarn").addEventListener("click", openGrown);

/* ---------- boot ---------- */
if (hasTTS) {
  pickVoice();
  try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch {}
  waitForVoices(3000).then(pickVoice);
}
renderHome();
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { state.mode = "local"; loadLocal(); renderHome(); applyDataFiles(); if (grownOpen) renderGrown(); return; }
  state.db = db; state.mode = "online";
  const onErr = (e) => { state.dbError = "Online storage stopped responding. Reload the page."; console.warn(e); if (grownOpen) renderGrown(); };
  db.doc("lists/current").onSnapshot((snap) => {
    const d = snap.exists ? snap.data() : null;
    state.words = normalizeWords(d && d.words);
    state.bank = normalizeWords(d && d.bank);
    state.sample = !!(d && d.sample);
    state.settings = { ...state.settings, ...((d && d.settings) || {}) }; fixPace(); syncLearn();
    state.wordsLoaded = true;
    applyDataFiles();
    if (!busy()) renderHome();
    if (grownOpen && !document.activeElement?.matches?.("input,textarea,select")) renderGrown();
  }, onErr);
  db.doc("progress/main").onSnapshot((snap) => {
    if (progSaving || busy() || snap.metadata.hasPendingWrites) return;
    state.progress = normalizeProgress(snap.exists ? snap.data() : null);
    renderHome();
    if (grownOpen && !document.activeElement?.matches?.("input,textarea,select")) renderGrown();
  }, onErr);
})();
})();
</script>
